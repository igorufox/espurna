; ESP32 on Arduino-ESP32 core 3.x (ESP-IDF 5.x) via pioarduino. Needs PlatformIO Core >= 6.2; its tool installer
; (idf_tools.py) refuses MSYS, run it outside Git Bash.
;
; Flash layout (esp32_4mb_safeboot.csv, Tasmota's offsets): factory app with the ESPurna safeboot (code/safeboot-app)
; at 0x10000 and one 2880 KB app slot for ESPurna at 0xE0000. OTA goes through the safeboot (WebUI /safeboot, the
; `safeboot` command or the crash-loop guard, ref. arch/esp32/safeboot_esp32.cpp). Boards on the old two-slot layout
; move over from the WebUI (/safeboot, Migrate), no serial flash.
;
; ONE env, env:esp32, one head image for every ESP32 board (docs/modules.md, "ESP32"):
;   py -3 -m platformio run -c platformio_esp32.ini -e esp32
; The env's own image is the head: relays, buttons, LEDs (pins from the settings: device template search of the WebUI,
; Tasmota template or by hand), Wi-Fi, web + the WebUI, MQTT, API, telnet, mDNS, safeboot, the module loader. The
; modules (custom_modules) are compiled in the same build with custom_module_flags and linked against the head
; (scripts/esp32_module_link.py, shared part scripts/module_link.py), switched in the WebUI MODULES panel: sensors,
; scheduler, alexa, homeassistant, domoticz, thingspeak, matter, nspanel (NSPanel pins: nspTx / nspRx / nspPower /
; nspBuzzer settings), test. Outputs in .pio/build_esp32/esp32:
;   espurna-esp32.bin          the initial image: the merged image (bootloader, partitions, boot_app0, safeboot, the
;                              head) and the modules on by default (head.h MODULES_ON_BY_DEFAULT) at the start of the
;                              module area in app0, installed by the first boot (scripts/module_initial_image.py)
;   espurna-esp32-modules.bin  every module package (the MODULES panel installs from it by the Apply)
;   espurna-esp32.ota          the install image: the head and every package (scripts/module_ota.py)
; The safeboot image comes from code/safeboot-app (ESP-IDF, its own project, built before: `pio run -d safeboot-app`).
;
; Matter (the matter module: On/Off plugs, one per relay, up to 4) starts with `matterAuto 1` or MATTER.START.
; Every board makes its own setup codes and device attestation on the first Matter start (espurna/matter_identity.cpp,
; one code with Beken), kept in NVS (namespace espurna-id) across updates.
; No ArduinoOTA and no OTA client: on this layout they would write the running slot

[platformio]
src_dir = espurna
; one ini and one build dir per chip: platformio_esp8266.ini / _esp32.ini / _beken.ini -> .pio/build_esp8266 / _esp32 / _beken
build_dir = .pio/build_esp32
default_envs = esp32
; the versions of the platform and the libraries: one for every chip
extra_configs = libraries.ini

[env:esp32]
platform = ${platforms.esp32}
board = esp32dev
board_build.partitions = esp32_4mb_safeboot.csv
; no dout: the pioarduino libraries come per memory type (dio_qspi / qio_qspi), dout has no sdkconfig.h. The board's
; bootloader sets the flash mode at boot
framework = arduino
; the head: espurna/config/head.h (one list for every chip), here only what is the ESP32's (module RAM: one heap block
; as big as the installed modules need, sized at each Apply, modules_esp32.cpp)
; (ARDUINO_ARCH_ESP32 comes from the framework, as ARDUINO_ARCH_ESP8266 and the LibreTiny ones)
; the one C++ standard (libraries.ini [toolchain]) instead of ESP-IDF's gnu++2b
build_unflags = -std=gnu++2b -std=gnu++23
build_flags = -std=${toolchain.cxx_std} -DOTA_ARDUINOOTA_SUPPORT=0
    -Iespurna/arch/esp32
    -Iespurna/arch/rtos
    -DESP32_GENERIC -DESPURNA_IMAGE=\"esp32\" -DMODULES_HEAP_MIN=1024 -DESPURNA_LWIP=\"${libraries.lwip}\"
    -DMODULES_SUPPORT=1
; chain+: with deep+ the LDF of PlatformIO 6.2 left Networking off the include path of WiFi
lib_ldf_mode = chain+
; TCP, TLS, the web server, telnet, MQTT: ESPurna's own on lwIP (libs/tcp.h, tls.h, http_server.h, mqtt_client.h)
lib_deps =
    ${libraries.arduinojson}
    ; core 3.x splits the network stack into its own libraries, the LDF does not find them by itself
    Networking
    WiFi
    ; BearSSL of the one TLS (libs/tls.h): the sources of the ESP8266 core's, as a library
    ${libraries.bearssl}
    ; the alexa module's (custom_module_libs)
    ${libraries.fauxmoesp}
    ; the rf module's (custom_module_libs)
    ${libraries.rcswitch}
    ; the sensors (Dallas) and light (MY92xx) modules' (custom_module_libs), the same versions as ESP8266
    ${libraries.onewire}
    ${libraries.my92xx}
    ${libraries.hlw8012}
    ; the sensor drivers' (custom_module_libs)
    ${libraries.newping}
    ${libraries.veml6075}
    ${libraries.vl53l1x}
    ${libraries.max6675}
    ${libraries.adafruit_busio}
    ${libraries.si1145}
    ${libraries.bsec}
    ${libraries.irremoteesp8266}
    ${libraries.rfm69}
    ${libraries.rpnlib}
    ${libraries.neopixel}
    ${libraries.ssd1306}
; FauxmoESP only in the modules: out of the head's LDF (the platform links libraries unarchived, a library of the LDF
; would be in the head), compiled for the modules by scripts/module_link.py (custom_module_libs). Matter: the library of
; Arduino-ESP32 (esp_matter) is not used, ever (the matter module has libMatterApp.a of matter-espurna, below)
; DNSServer: the core's one is replaced by lib/DNSServer, the same code on every chip (on its EspurnaUdp, not the core AsyncUDP)
lib_ignore =
    Matter
    FauxmoESP
    rc-switch
    OneWire
    my92xx
    hlw8012
    DNSServer
    DNSServer-espurna
    NewPing
    SparkFun VEML6075 Arduino Library
    VL53L1X
    MAX6675-Library
    Adafruit BusIO
    Adafruit SI1145 Library
    BSEC Software Library
    IRremoteESP8266
    RFM69
    RPNlib
    Adafruit NeoPixel
    ESP8266 and ESP32 OLED driver for SSD1306 displays
; the chip's files: arch/esp32 and arch/rtos; the module_*.cpp objects are the modules'
build_src_filter = +<*> -<arch/esp8266/> -<arch/beken/> -<module_*.cpp>
extra_scripts =
    pre:scripts/esp32_v3_paths.py
    pre:scripts/no_ino.py
    pre:scripts/matter_lib.py
    post:scripts/esp32_merge.py
    post:scripts/pio_main.py
    scripts/module_head.py
    scripts/esp32_module_link.py
custom_head_exports = espurna/modules_exports.txt
; the Matter library of ESPurna (matter-espurna, the same as the BK7231N one: connectedhomeip, the plug.zap data model,
; the application; connectedhomeip's ESP32 platform under it), its ESP32 package (scripts/matter_lib.py), only for the
; matter module. Pinned by hand as on the Beken: custom_matter_lib (the URL of matter-espurna-esp32.zip of a libmatter-*
; release) and custom_matter_lib_sha256
custom_matter_chip = esp32
custom_matter_lib = https://github.com/igorufox/matter-espurna/releases/download/libmatter-20261114-da42832/matter-espurna-esp32.zip
custom_matter_lib_sha256 = b180d5686c8c77c2cae080967fd64896340d9b39a06bfaad4e256f1f652328b0
; the connectedhomeip of esp_matter in the prebuilt libraries of Arduino-ESP32: never in a module link (another build of
; the stack than libMatterApp.a)
custom_module_lib_exclude = espressif__esp_matter
; the module objects (scripts/module_link.py): MODULE_BUILD (espurna/config/head.h), plus what only the ESP32 has
; os_delay_us: the ESP8266 SDK name my92xx (light module) calls, the ESP32 core has ets_delay_us
custom_module_flags = -DMODULE_BUILD=1 -Dos_delay_us=ets_delay_us
; libraries only the modules use (the head's LDF does not have them); Wire: the i2c module's (the I2C bus)
custom_module_libs = FauxmoESP DNSServer rc-switch Wire OneWire my92xx hlw8012 NewPing SparkFun_VEML6075_Arduino_Library VL53L1X MAX6675-Library Adafruit_BusIO Adafruit_SI1145_Library BSEC_Software_Library IRremoteESP8266 RFM69 RPNlib Adafruit_NeoPixel ESP8266_and_ESP32_OLED_driver_for_SSD1306_displays SPI
; the part of a library the modules build (scripts/module_link.py): of Adafruit BusIO the I2C device of si1145,
; of RFM69 the radio (RFM69_OTA.cpp would need the SPIFlash library, ESPurna has no RFM69 OTA)
custom_module_lib_filter =
    Adafruit_BusIO -<*> +<Adafruit_I2CDevice.cpp>
    RFM69 -<*> +<RFM69.cpp> +<RFM69_ATC.cpp>
; the modules: one list for every chip in espurna/config/head.h (ESPURNA_MODULES); here only the ESP32's part
;   custom_modules: a line of a module of that list adds the chip's own objects (first), a new name is a module of
;   this chip alone (same columns: <name> | <objects> | <objects only for what the head does not have> | <provides>
;   | <needs>); custom_modules_skip: the modules of the list this chip does not build
; matter: arch/esp32/matter_errorstr_esp32.cpp.o FIRST (it displaces the TLS member ErrorStr of CHIP)
custom_modules =
    ntp | arch/esp32/ntp_esp32.cpp.o arch/rtos/ntp_rtos.cpp.o | |
    matter | arch/esp32/matter_errorstr_esp32.cpp.o arch/esp32/matter_esp32.cpp.o | |
