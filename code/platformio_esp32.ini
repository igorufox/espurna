; ESP32 on ESP-IDF 5.5 (framework = espidf, pioarduino platform), no Arduino core: ESPurna's code is on the chip calls of
; arch/esp32/core_esp32.cpp (also app_main() and the loop task); the Arduino names (String, Serial, WiFi, Wire, SPI ...)
; are the layer lib/espurna-core for the third-party libraries of the modules only. The ESP-IDF configuration: sdkconfig.defaults; the sources: CMakeLists.txt and
; espurna/CMakeLists.txt (build_src_filter does not work with ESP-IDF). Needs PlatformIO Core >= 6.2; its tool installer
; (idf_tools.py) refuses MSYS, run it outside Git Bash.
;
; Flash layout (esp32_4mb.csv): one application partition app0 at 0x10000, 3712 KB (the head and the modules behind
; it), the settings pool in the top of spiffs, coredump. No safeboot (owner 2026-11-18): the head is not replaced over
; the network, the modules are (the Apply).
;
; ONE env, env:esp32, one head image for every ESP32 board (docs/modules.md, "ESP32"):
;   py -3 -m platformio run -c platformio_esp32.ini -e esp32
; The env's own image is the head: relays, buttons, LEDs (pins from the settings: device template search of the WebUI,
; Tasmota template or by hand), Wi-Fi, web + the WebUI, MQTT, API, telnet, mDNS, the module loader. The
; modules (custom_modules) are compiled in the same build with custom_module_flags and linked against the head
; (scripts/esp32_module_link.py, shared part scripts/module_link.py), switched in the WebUI MODULES panel: sensors,
; scheduler, alexa, homeassistant, domoticz, thingspeak, matter, screen + nextion (NSPanel pins: nspTx / nspRx / nspPower /
; nspBuzzer settings), test. Outputs in .pio/build_esp32/esp32:
;   espurna-esp32.bin          the initial image: the merged image (bootloader, partitions, the head)
;                              and the modules on by default (head.h MODULES_ON_BY_DEFAULT) at the start of the
;                              module area in app0, installed by the first boot (scripts/module_initial_image.py)
;   espurna-esp32-modules.bin  every module package (the MODULES panel installs from it by the Apply)
;   espurna-esp32.ota          the install image: the head and every package (scripts/module_ota.py)
;
; Matter (the matter module: On/Off plugs, one per relay, up to 4) starts with `matterAuto 1` or MATTER.START.
; Every board makes its own setup codes and device attestation on the first Matter start (espurna/matter_identity.cpp,
; one code with Beken), kept in NVS (namespace espurna-id) across updates.
; No ArduinoOTA and no OTA client: on this layout they would write the running slot

[platformio]
src_dir = espurna
; one ini and one build dir per chip: platformio_esp8266.ini / _esp32.ini / _beken.ini -> .pio/build_esp8266 / _esp32 / _beken
build_dir = .pio/build_esp32
default_envs = esp32
; the versions of the platform and the libraries: one for every chip
extra_configs = libraries.ini

[env:esp32]
platform = ${platforms.esp32}
board = esp32dev
board_build.partitions = esp32_4mb.csv
framework = espidf
; FlashDB of Matter's key-value store (scripts/flashdb.py)
platform_packages =
    ${platforms.flashdb}
; the head: espurna/config/head.h (one list for every chip), here only what is the ESP32's (module RAM: one heap block
; as big as the installed modules need, sized at each Apply, modules_esp32.cpp)
; ESP32: what ESPurna's own code and the libraries test for the chip (ESP32=ESP32: the Matter headers name
; <platform/ESP32/...>, ESP32=1 would make it <platform/1/...>). The Arduino macros are the modules' only
; (custom_module_flags: their third-party libraries)
; the one C++ standard (libraries.ini [toolchain]) instead of ESP-IDF's gnu++2b
build_unflags = -std=gnu++2b -std=gnu++23
build_flags = -std=${toolchain.cxx_std}
    -DESP32=ESP32
    -Iespurna/arch/esp32
    -Iespurna/arch/rtos
    -DESP32_GENERIC -DESPURNA_IMAGE=\"esp32\" -DMODULES_HEAP_MIN=1024 -DESPURNA_LWIP=\"${libraries.lwip}\" -DESPURNA_MBEDTLS=\"${libraries.mbedtls}\"
    -DMODULES_SUPPORT=1
lib_ldf_mode = chain+
; the libraries name the arduino framework only (library.json / library.properties): they build on the layer
lib_compat_mode = off
; TCP, TLS, the web server, telnet, MQTT: ESPurna's own on lwIP (libs/tcp.h, tls.h, http_server.h, mqtt_client.h)
lib_deps =
    ; the head's: ESPurna's string (espurna_string.h) and the platform header of the forks
    ${libraries.espurna_base}
    ; the alexa module's (custom_module_libs)
    ${libraries.fauxmoesp}
    ; the rf module's (custom_module_libs)
    ${libraries.rcswitch}
    ; the sensor drivers' (custom_module_libs)
    ${libraries.vl53l1x}
    ${libraries.bsec}
    ${libraries.irremoteesp8266}
    ${libraries.rfm69}
    ${libraries.rpnlib}
    ${libraries.neopixel}
    ; the screen module's: the Matter QR code (custom_module_libs)
    ${libraries.qrcode}
; FauxmoESP only in the modules: out of the head's LDF (the platform links libraries unarchived, a library of the LDF
; would be in the head), compiled for the modules by scripts/module_link.py (custom_module_libs). DNSServer: lib/DNSServer,
; the same code on every chip (on libs/udp.h of the head)
lib_ignore =
    ; the layer of the Arduino names: the head links nothing of it, the modules' libraries get it (custom_module_libs)
    espurna-core
    FauxmoESP
    rc-switch
    DNSServer-espurna
    VL53L1X
    BSEC Software Library
    IRremoteESP8266
    RFM69
    RPNlib
    Adafruit NeoPixel
    QRCode
; the chip's files (arch/esp32, arch/rtos) and not the module_*.cpp objects: espurna/CMakeLists.txt
extra_scripts =
    pre:scripts/no_ino.py
    pre:scripts/head_page.py
    pre:scripts/matter_lib.py
    post:scripts/esp32_merge.py
    post:scripts/flashdb.py
    post:scripts/pio_main.py
    scripts/module_head.py
    scripts/esp32_module_link.py
custom_head_exports = espurna/modules_exports.txt
; FlashDB of Matter's key-value store (scripts/flashdb.py): the FAL of espurna/arch/esp32/flashdb
custom_flashdb_chip = esp32
; the Matter library of ESPurna (matter-espurna, the same as the BK7231N one: connectedhomeip, the plug.zap data model,
; the application; connectedhomeip's ESP32 platform under it), its ESP32 package (scripts/matter_lib.py), only for the
; matter module. Pinned by hand as on the Beken: custom_matter_lib (the URL of matter-espurna-esp32.zip of a libmatter-*
; release) and custom_matter_lib_sha256
custom_matter_chip = esp32
custom_matter_lib = https://github.com/igorufox/matter-espurna/releases/download/libmatter-20261124-8c011f1/matter-espurna-esp32.zip
custom_matter_lib_sha256 = 23e01b43f905e89a0d3fbd15f03b626b9559f2337057e71ed8d0846ca8049eeb
; the module objects (scripts/module_link.py): MODULE_BUILD (espurna/config/head.h), plus what only the ESP32 has
; VL53L1X_NO_ARDUINO: the VL53L1X library (igorufox/vl53l1x) on the bus the vl53l1x module gives it
custom_module_flags = -DMODULE_BUILD=1 -DVL53L1X_NO_ARDUINO -DARDUINO=10812 -DARDUINO_ARCH_ESP32
; libraries only the modules use (the head's LDF does not have them). espurna-core: the layer of the Arduino names
; (Wire, SPI, String ... of lib/espurna-core) for the third-party libraries of the modules only, the head links nothing
; of it (owner 2026-11-18: ESPurna's own code without the layer); last: the archives before it call into it
custom_module_libs = FauxmoESP DNSServer rc-switch VL53L1X BSEC_Software_Library IRremoteESP8266 RFM69 RPNlib Adafruit_NeoPixel QRCode espurna-core
; the part of a library the modules build (scripts/module_link.py): of RFM69 the radio (RFM69_OTA.cpp would need the SPIFlash library, ESPurna has no RFM69 OTA)
custom_module_lib_filter =
    RFM69 -<*> +<RFM69.cpp> +<RFM69_ATC.cpp>
; the modules: one list for every chip in espurna/config/head.h (ESPURNA_MODULES); here only the ESP32's part
;   custom_modules: a line of a module of that list adds the chip's own objects (first), a new name is a module of
;   this chip alone (same columns: <name> | <objects> | <objects only for what the head does not have> | <provides>
;   | <needs>); custom_modules_skip: the modules of the list this chip does not build
; ble: the NimBLE driver; the controller (libbtdm_app) and NimBLE of ESP-IDF's bt component come from the archives, the
; controller's IRAM_ATTR code goes into the IRAM pool (package version 7, scripts/esp32_module.ld .mod_iram)
; matter: arch/esp32/matter_errorstr_esp32.cpp.o FIRST (it displaces the TLS member ErrorStr of CHIP)
custom_modules =
    ntp | arch/rtos/ntp_rtos.cpp.o | |
    i2c | arch/esp32/i2c_esp32.cpp.o | |
    spi | arch/esp32/spi_esp32.cpp.o | |
    light_pwm | arch/esp32/pwm_esp32.cpp.o | |
    matter | arch/esp32/matter_errorstr_esp32.cpp.o arch/esp32/matter_esp32.cpp.o | |
    ble | arch/esp32/ble_esp32.cpp.o | |
