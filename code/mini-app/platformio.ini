; ESPurna mini for 1 MB ESP8266 boards: the first step of the two-step update (src/main.cpp).
; Plain Arduino core, same core / SDK / toolchain / flash layout as env:esp8266 of ../platformio_esp8266.ini
; (core 3.1.2 = espressif8266 4.2.1, NONOS SDK 3.0.5, eagle.flash.1m.ld, DOUT), no ESPurna code.
;   from code/: pio run -d mini-app
; CI copies .pio/build/esp8266-1m-mini/firmware.bin as espurna-esp8266-1m-mini.bin (+ pigz -11 -n as .bin.gz).
; Its .bin.gz has to fit the free space of the biggest 1 MB full image minus one sector (ota_web.cpp), every KB counts

[platformio]
default_envs = esp8266-1m-mini
; the versions of the platform and the libraries: one for every build
extra_configs = ../libraries.ini

[env:esp8266-1m-mini]
platform = ${platforms.esp8266}
platform_packages =
    ${platforms.esp8266_toolchain}
framework = arduino
board = esp01_1m
board_build.ldscript = eagle.flash.1m.ld
board_build.flash_mode = dout
; lwIP without IP forwarding / NAPT / fragment reassembly (smaller), TCP MSS 1460 as ESPurna; no Core asserts.
; Options: -DMINI_LOG=0 drops the serial log (TX pin, 115200)
build_flags =
    -w
    -DNDEBUG
    -DNO_GLOBAL_EEPROM
    -DPIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK305
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH_LOW_FLASH
lib_deps =
    ${libraries.eeprom_rotate}
monitor_speed = 115200
extra_scripts = scripts/nofloat.py
