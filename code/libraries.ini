; Every library and platform of every build, ONE version each, written once (owner 2026-11-12: «общие библиотеки
; имеют всегда одну версию, физически нельзя разные указать»). The configs (platformio_esp8266.ini, platformio_esp32.ini,
; platformio_beken.ini) take this file through extra_configs and
; name a library or a platform only as ${libraries.<name>} / ${platforms.<name>}: a spec of their own fails
; scripts/ci_ini_lint.py. Exact versions only (a release, a commit, a tag of our forks), never a range.
; A new version is one edit here, every chip gets it.
;
; No [platformio] section here: an extra config with a build_dir would take over the build dir of the chip.

[toolchain]
; ONE C++ standard for every config (U26). gnu++17: the newest the GCC 10.3 of ESP8266 has in full, the Matter
; library is built with it; ESP-IDF 5.5 (ESP32) defaults to gnu++2b, its headers take 17.
; Each config passes -std=${toolchain.cxx_std}; where the platform's own differs (ESP32 gnu++2b, Beken gnu++11) it
; drops that one with build_unflags (not the same value: build_unflags would drop ours as well)
cxx_std = gnu++17

[platforms]
; espressif8266 only for its board files and esptool: no framework of it is used (platformio_esp8266.ini)
esp8266 = espressif8266 @ 4.2.1
; ESP8266_RTOS_SDK 3.4 COMPILED by its release (owner 2026-11-20 «все по учебнику»): igorufox/ESP8266_RTOS_SDK
; tools/espurna/build.py builds the SDK with GCC 14.2, FreeRTOS-Kernel and Mbed TLS 3.6.6 into archives, headers,
; sdkconfig, linker scripts and flags; scripts/esp8266_rtos_sdk.py only links it
esp8266_sdk = framework-esp8266-rtos-sdk @ https://github.com/igorufox/ESP8266_RTOS_SDK/releases/download/3.4.0-espurna.7/framework-esp8266-rtos-sdk-3.4.0-espurna.7.zip
; GCC 14.2 on the ESP8266 too (owner 2026-11-19, regress-todo.md item 35): Espressif's xtensa-esp-elf 14.2, the same
; package as the ESP32's, compiles for the lx106 core with its xtensa_esp8266 configuration (scripts/esp8266_rtos_sdk.py
; sets XTENSA_GNU_CONFIG); the lx106 target libraries (call0: libgcc, newlib 4.3, libstdc++) are our build of the same
; Espressif sources: built by GitHub Actions of igorufox/toolchain-xtensa-lx106 (build-lx106.sh), its release pinned here
; (the platform's own toolchain-xtensa slot is the libraries package: the platform requires a package of that name,
; else it installs its GCC 10.3 that nothing uses; the compiler is added under its real name)
; the compiler by the spec the ESP32 platform (pioarduino 55.03.312) has for it: the same zip, one version on both
esp8266_toolchain = toolchain-xtensa-esp-elf @ https://github.com/pioarduino/registry/releases/download/0.0.1/xtensa-esp-elf-14.2.0_20260121.zip
esp8266_libs = toolchain-xtensa @ https://github.com/igorufox/toolchain-xtensa-lx106/releases/download/14.2.0-espurna.1/toolchain-xtensa-lx106-14.2.0-espurna.1.zip
; pinned (owner 2026-11-10): `stable` moved to another ESP-IDF unannounced and broke the ESP32 build
esp32 = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
; Beken: ESPurna's own platform igorufox/platform-beken (the toolchain and the board; release 1.0.0 made by its CI from
; platform.json, pinned by its commit); no LibreTiny (owner 2026-11-18)
beken = https://github.com/igorufox/platform-beken.git#f64a96dcb5d2d4a8e70fe996b2578dfdaa685d8a
; GCC (owner 2026-11-17: one version, 14.2): 14.2 on ESP32 (ESP-IDF 5.5 and its prebuilt libraries are built with it)
; and Beken; ESP8266 8.4 until our lx106 GCC 14.2 package exists (architecture-plan.md)
beken_toolchain = platformio/toolchain-gccarmnoneeabi @ 1.140201.0
; the BK7231N SDK COMPILED by the release of igorufox/platform-beken (owner 2026-11-20 «все по учебнику»): its
; sdk/build.py compiles the BDK 3.0.33 (libretiny-eu, unchanged) with its glue, FreeRTOS-Kernel 11.1.0-espurna.3 with
; the ARM968 port, lwIP 2.2.0 with the BDK port and Mbed TLS 3.6.6; scripts/beken_bdk.py only links it
beken_bdk = framework-beken-bdk @ https://github.com/igorufox/platform-beken/releases/download/sdk-3.0.33-espurna.2/framework-beken-bdk-3.0.33-espurna.2.zip
; FlashDB 1.2.0 (Matter's key-value store on every chip; its FAL is the chip's flash layout, so ESPurna compiles it:
; scripts/flashdb.py): libretiny-eu's package, unchanged, at the commit the Beken boards were built with
flashdb = library-flashdb @ https://github.com/libretiny-eu/library-flashdb.git#d5c892f0c545884e9f0de0cf67215e426dc8109d

[libraries]
; lwIP: not a library PlatformIO installs, it comes built into the platform of the chip (ESP8266 core lwip2, ESP-IDF
; esp-lwip, LibreTiny library-lwip). Every config passes its value as -DESPURNA_LWIP, libs/net_impl.h (the network
; stack of every image) stops the build when the platform brings another one (MAJOR.MINOR.REVISION of
; LWIP_VERSION_STRING; ESP-IDF builds esp-lwip "2.2.0d", Espressif's fork of the 2.2.0 development branch).
;
; ONE lwIP for the three chips (owner 2026-11-17): esp-lwip 2.2.0-esp, the commit of ESP-IDF 5.5.5 (fd432e4e) - ESP32 by
; its IDF, ESP8266 in our ESP8266_RTOS_SDK package (its lwip port moved to 2.2: lwip_esp8266_hooks.c), Beken next
; (architecture-plan.md)
lwip = 2.2.0
; mbedTLS: MAJOR.MINOR.PATCH of every chip's mbedtls (MBEDTLS_VERSION_STRING), passed as -DESPURNA_MBEDTLS and checked
; by libs/hash.h. ESP32 by its ESP-IDF 5.5, ESP8266 and Beken by their compiled SDK releases ([platforms] esp8266_sdk, beken_bdk)
mbedtls = 3.6.6
; espurna-base: the platform header of the forks below (<espurna_base.h> instead of <Arduino.h>) and ESPurna's string
; (espurna_string.h): the head builds it, the libraries of the modules see its headers only (owner 19.11 «оставляем
; эту же схему», as Arduino before)
espurna_base = https://github.com/igorufox/espurna-base.git#1.0.0
; the rtos branch of our fork (owner 19.11 «правь форки в отдельных бранчах rtos»): no Arduino, <espurna_base.h>
fauxmoesp = https://github.com/igorufox/fauxmoESP.git#3.4.1-espurna.3
rcswitch = https://github.com/1technophile/rc-switch#11402652
; the rtos branch of our fork (owner 19.11 «правь форки в отдельных бранчах rtos»): no Arduino, <espurna_base.h>
irremoteesp8266 = https://github.com/igorufox/IRremoteESP8266.git#2.9.0-espurna.2
rfm69 = lowpowerlab/RFM69@1.6.0
rpnlib = mcspr/RPNlib@0.24.1
vl53l1x = https://github.com/igorufox/vl53l1x.git#1.3.1-espurna.1
bsec = https://github.com/BoschSensortec/BSEC-Arduino-library.git#v1.6.1480
neopixel = adafruit/Adafruit NeoPixel@1.15.4
; the QR matrix of the Matter pairing code on any screen (the screen module). Its header is qrcode.h, the
; same name as ESP-IDF's espressif__qrcode (esp_qrcode_*): scripts/module_link.py puts the module libraries first on
; the include path, the modules get this one
qrcode = ricmoo/QRCode@0.0.1
