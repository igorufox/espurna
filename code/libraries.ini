; Every library and platform of every build, ONE version each, written once (owner 2026-11-12: «общие библиотеки
; имеют всегда одну версию, физически нельзя разные указать»). The configs (platformio_esp8266.ini, platformio_esp32.ini,
; platformio_beken.ini, safeboot-app/platformio.ini, mini-app/platformio.ini) take this file through extra_configs and
; name a library or a platform only as ${libraries.<name>} / ${platforms.<name>}: a spec of their own fails
; scripts/ci_ini_lint.py. Exact versions only (a release, a commit, a tag of our forks), never a range.
; A new version is one edit here, every chip gets it.
;
; No [platformio] section here: an extra config with a build_dir would take over the build dir of the chip.

[platforms]
esp8266 = espressif8266 @ 4.2.1
esp8266_toolchain = platformio/toolchain-xtensa @ 2.100300.220621
; pinned (owner 2026-11-10): `stable` moved to another ESP-IDF unannounced and broke the safeboot build
esp32 = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
beken = libretiny @ 1.14.0

[libraries]
; the network stack of the chip: the same API, the chip's implementation (ESP8266 has no FreeRTOS)
espasynctcp = esp32async/ESPAsyncTCP@2.0.0
asynctcp = esp32async/AsyncTCP@3.5.0
arduinojson = bblanchon/ArduinoJson@5.13.4
; BearSSL of the one HTTP client (espurna/libs/http_client.h): the sources of the ESP8266 core's, our fork
bearssl = https://github.com/igorufox/bearssl-esp8266.git#0.6.0-espurna.1
; MQTT: the same library on every chip (the ESP8266 had marvinroger/AsyncMqttClient 0.8.2, the others this fork)
asyncmqttclient = heman/AsyncMqttClient-esphome@2.1.0
arduinomqtt = https://github.com/256dpi/arduino-mqtt#196556b6
pubsubclient = knolleary/PubSubClient@2.8
eeprom_rotate = xoseperez/EEPROM_Rotate@0.9.2
fauxmoesp = https://github.com/igorufox/fauxmoESP.git#3.4.1-espurna.2
rcswitch = https://github.com/1technophile/rc-switch#11402652
onewire = paulstoffregen/OneWire@2.3.8
my92xx = xoseperez/my92xx@3.0.3
hlw8012 = xoseperez/hlw8012@1.1.2
irremoteesp8266 = crankyoldgit/IRremoteESP8266@2.8.2
nofuss = https://github.com/mcspr/nofuss.git#0.4.0
spiflash = lowpowerlab/SPIFlash@101.1.3
rfm69 = lowpowerlab/RFM69@1.6.0
rpnlib = mcspr/RPNlib@0.24.1
newping = teckel12/NewPing@1.9.7
veml6075 = sparkfun/SparkFun VEML6075 Arduino Library@1.1.5
vl53l1x = pololu/VL53L1X@1.3.1
max6675 = https://github.com/mcleng/MAX6675-Library#2.0.1
ssd1306 = https://github.com/ThingPulse/esp8266-oled-ssd1306#9be7b01
adafruit_busio = adafruit/Adafruit BusIO@1.17.4
si1145 = adafruit/Adafruit SI1145 Library@1.2.2
bsec = https://github.com/BoschSensortec/BSEC-Arduino-library.git#v1.6.1480
neopixel = adafruit/Adafruit NeoPixel@1.15.4
