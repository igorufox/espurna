; Every library and platform of every build, ONE version each, written once (owner 2026-11-12: «общие библиотеки
; имеют всегда одну версию, физически нельзя разные указать»). The configs (platformio_esp8266.ini, platformio_esp32.ini,
; platformio_beken.ini, safeboot-app/platformio.ini, migration-app/platformio.ini) take this file through extra_configs and
; name a library or a platform only as ${libraries.<name>} / ${platforms.<name>}: a spec of their own fails
; scripts/ci_ini_lint.py. Exact versions only (a release, a commit, a tag of our forks), never a range.
; A new version is one edit here, every chip gets it.
;
; No [platformio] section here: an extra config with a build_dir would take over the build dir of the chip.

[toolchain]
; ONE C++ standard for every config (U26). gnu++17: the newest the GCC 10.3 of ESP8266 has in full, the Matter
; library is built with it; ESP-IDF 5.5 (ESP32, the safeboot) defaults to gnu++2b, its headers take 17.
; Each config passes -std=${toolchain.cxx_std}; where the platform's own differs (ESP32 gnu++2b, Beken gnu++11) it
; drops that one with build_unflags (not the same value: build_unflags would drop ours as well)
cxx_std = gnu++17

[platforms]
esp8266 = espressif8266 @ 4.2.1
esp8266_toolchain = platformio/toolchain-xtensa @ 2.100300.220621
; pinned (owner 2026-11-10): `stable` moved to another ESP-IDF unannounced and broke the safeboot build
esp32 = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
beken = libretiny @ 1.14.0
; GCC (U25, owner 2026-11-13): two versions, 14.2 on ESP32 (ESP-IDF 5.5 and its prebuilt libraries are built with it)
; and Beken (this one instead of LibreTiny's 10.3), 10.3 on ESP8266 and the migration image (esp8266_toolchain: no newer
; GCC for the lx106 exists, the NONOS SDK blobs are built with the old one)
beken_toolchain = platformio/toolchain-gccarmnoneeabi @ 1.140201.0

[libraries]
; lwIP: not a library PlatformIO installs, it comes built into the platform of the chip (ESP8266 core lwip2, ESP-IDF
; esp-lwip, LibreTiny library-lwip). Every config passes its value as -DESPURNA_LWIP, libs/net_impl.h (the network
; stack of every image) stops the build when the platform brings another one (MAJOR.MINOR.REVISION of
; LWIP_VERSION_STRING; ESP-IDF builds esp-lwip "2.2.0d", Espressif's fork of the 2.2.0 development branch).
;
; TWO VERSIONS ON PURPOSE (owner 2026-11-12: «остаёмся на 2.2 и 2.1, да разнобой, но ядро не пересобираем»):
; - ESP32, Beken, the ESP32 safeboot: 2.2.0, what their SDKs bring
; - ESP8266 and the migration image: 2.1.3. The ESP8266 core is NONOS: its last release (3.1.2, March 2023) and its master have
;   lwIP 2.1.3 built in by its link layer (esp82xx-nonos-linklayer, STABLE-2_1_3, no 2.2 port anywhere). 2.2.0 there
;   means a fork of the link layer (lwIP 2.2.0, its patches ported) AND a fork of the core with the rebuilt
;   liblwip2-*.a and headers, which the core itself is compiled against - work that ends with the move to
;   ESP8266_RTOS_SDK (planned), which has its own lwIP
; - ESPurna needs nothing of 2.2.0: libs/tcp.h, tls.h, the HTTP client and server, MQTT and telnet use the raw TCP API,
;   DNS and tcpip_api_call(), the same in 2.1.3 and 2.2.0
lwip = 2.2.0
lwip_esp8266 = 2.1.3
arduinojson = bblanchon/ArduinoJson@5.13.4
; BearSSL of the one TLS (espurna/libs/tls.h: HTTP and MQTT), every chip and the migration image / safeboot: the sources of
; the ESP8266 core's, our fork (the ESP8266 core's prebuilt libbearssl.a leaves the link, scripts/pio_main.py)
bearssl = https://github.com/igorufox/bearssl-esp8266.git#0.6.0-espurna.2
fauxmoesp = https://github.com/igorufox/fauxmoESP.git#3.4.1-espurna.2
rcswitch = https://github.com/1technophile/rc-switch#11402652
onewire = paulstoffregen/OneWire@2.3.8
my92xx = xoseperez/my92xx@3.0.3
hlw8012 = xoseperez/hlw8012@1.1.2
irremoteesp8266 = https://github.com/igorufox/IRremoteESP8266.git#2.9.0-espurna.1
rfm69 = lowpowerlab/RFM69@1.6.0
rpnlib = mcspr/RPNlib@0.24.1
newping = teckel12/NewPing@1.9.7
veml6075 = sparkfun/SparkFun VEML6075 Arduino Library@1.1.5
vl53l1x = pololu/VL53L1X@1.3.1
max6675 = https://github.com/mcleng/MAX6675-Library#2.0.1
ssd1306 = https://github.com/ThingPulse/esp8266-oled-ssd1306#9be7b01
adafruit_busio = adafruit/Adafruit BusIO@1.17.4
si1145 = adafruit/Adafruit SI1145 Library@1.2.2
bsec = https://github.com/BoschSensortec/BSEC-Arduino-library.git#v1.6.1480
neopixel = adafruit/Adafruit NeoPixel@1.15.4
; the QR matrix of the Matter pairing code on the NSPanel display (the nspanel module). Its header is qrcode.h, the
; same name as ESP-IDF's espressif__qrcode (esp_qrcode_*): scripts/module_link.py puts the module libraries first on
; the include path, the modules get this one
qrcode = ricmoo/QRCode@0.0.1
