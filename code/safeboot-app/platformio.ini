; ESPurna safeboot for ESP32: the image of the factory partition of esp32_4mb_safeboot.csv (0x10000, 832 KB).
; Plain ESP-IDF (pioarduino platform, same as platformio_esp32.ini), the Arduino core alone was 960 KB.
;   pio run -d code/safeboot-app
; Size options in sdkconfig.defaults; a stale sdkconfig.esp32-safeboot here overrides them (delete it after changes)

[platformio]
; the versions of the platform and the libraries: one for every build
extra_configs = ../libraries.ini

[env:esp32-safeboot]
platform = ${platforms.esp32}
board = esp32dev
framework = espidf
board_build.partitions = ../esp32_4mb_safeboot.csv
board_upload.flash_size = 4MB
; BearSSL of the one HTTP client (espurna/libs/http_client.h), the same release as platformio_esp32.ini. Its
; library.json names the arduino framework only: the compatibility check is off for it here
lib_deps =
    ${libraries.bearssl}
lib_compat_mode = off
; the one lwIP version (code/libraries.ini), checked by espurna/libs/net_impl.h
build_flags =
    -DESPURNA_LWIP=\"${libraries.lwip}\"
