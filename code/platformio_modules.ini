; PROTOTYPE (docs/esp8266-modules.md): ESP8266 1 MB head image + installable modules
;   py -3 -m platformio run -c platformio_modules.ini -e esp8266-1m-head -e esp8266-1m-modules
; The head first: every module links against the head's firmware.elf of the same build dir.
; Own build_dir, so building this does not wipe .pio/build of platformio.ini.

[platformio]
src_dir = espurna
build_dir = .pio/build_modules
extra_configs = platformio.ini
default_envs = esp8266-1m-head, esp8266-1m-modules

; relays, buttons, LEDs, Wi-Fi, web, MQTT, API, telnet, OTA + the module loader (the integrations go to modules:
; scheduler, Home Assistant, Alexa, Domoticz, Thingspeak, mDNS are off here). No sensor code; the WebUI of the
; sensor image, so the panels of the sensors module show up
[env:esp8266-1m-head]
extends = env:esp8266-1m-sdk3-base
; 48 KB IRAM (flash cache 16 KB): the IRAM after the code holds the RAM of the modules installed with ram=iram
build_flags = ${common.build_flags_sdk3} -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48 -DNON32XFER_HANDLER
build_src_flags = -DESP8266_GENERIC -DMODULES_SUPPORT=1 -DWEBUI_IMAGE=2 -DSCHEDULER_SUPPORT=0 -DHOMEASSISTANT_SUPPORT=0 -DALEXA_SUPPORT=0 -DDOMOTICZ_SUPPORT=0 -DTHINGSPEAK_SUPPORT=0 -DMDNS_SERVER_SUPPORT=0 -DESPURNA_IMAGE=\"esp8266-1m-head\"
extra_scripts =
    pre:scripts/pio_pre.py
    scripts/pio_main.py
    scripts/esp8266_head_exports.py
custom_head_exports = espurna/modules_exports.txt

; every module of the head (scripts/esp8266_module_link.py): compiles the tree with every module's part on (its own
; firmware.elf is such an image, not used), then links each module of custom_modules against the head
;   <name> | <objects> | <objects only for what the head does not have> | <functions it provides to other modules>
[env:esp8266-1m-modules]
extends = env:esp8266-1m-sdk3-base
build_flags = ${common.build_flags_sdk3} -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48 -DNON32XFER_HANDLER
build_src_flags = -DESP8266_GENERIC -DMODULE_BUILD=1 -DWEBUI_IMAGE=2 -DHLW8012_SUPPORT=1 -DCSE7766_SUPPORT=1 -DV9261F_SUPPORT=1 -DECH1560_SUPPORT=1 -DPZEM004T_SUPPORT=1 -DPZEM004TV30_SUPPORT=1 -DADE7953_SUPPORT=1 -DDHT_SUPPORT=1 -DDALLAS_SUPPORT=1 -DBMX280_SUPPORT=1 -DANALOG_SUPPORT=1 -DNTC_SUPPORT=1 -DDIGITAL_SUPPORT=1 -DDUMMY_SENSOR_SUPPORT=1 -DLIGHT_PROVIDER=LIGHT_PROVIDER_ANY -DRFB_SUPPORT=1 -DESPURNA_IMAGE=\"esp8266-1m-head\"
extra_scripts =
    pre:scripts/pio_pre.py
    scripts/pio_main.py
    scripts/esp8266_module_link.py
custom_module_head = esp8266-1m-head
; the full image (scripts/esp8266_full_image.py): these modules' RAM goes to the IRAM tail, the rest to the DRAM arena
; (all of them together need ~8 KB, the arena has 5 KB); modules with interrupt code (light PWM, RF) stay in DRAM
custom_full_ram_in_iram = sensors
custom_module_exports = espurna/modules_exports.txt
custom_modules =
    sensors | sensor.cpp.o module_sensors.cpp.o | i2c.cpp.o driver_onewire.cpp.o uart.cpp.o fs_math.c.o | magnitudeCount magnitudeInfo magnitudeTypeTopic magnitudeUnitsName sensorReady sensorWebSocketMagnitudes sensorOnMagnitudeRead sensorOnMagnitudeReport magnitudeValue magnitudeReportValue magnitudeReadValue magnitudeType magnitudeIndex magnitudeTopic
    scheduler | scheduler.cpp.o module_scheduler.cpp.o | |
    alexa | alexa.cpp.o module_alexa.cpp.o | |
    mdns | mdns.cpp.o module_mdns.cpp.o | |
    homeassistant | homeassistant.cpp.o module_homeassistant.cpp.o | |
    domoticz | domoticz.cpp.o module_domoticz.cpp.o | | domoticzSendMagnitude
    thingspeak | thingspeak.cpp.o module_thingspeak.cpp.o | | tspkEnqueueMagnitude
    light | light.cpp.o module_light.cpp.o | pwm.cpp.o arch/esp8266/pwm_esp8266.c.o | lightBlue lightBrightness lightBrightnessPercent lightChannel lightChannels lightColdWhite lightColor lightGreen lightHasColdWhite lightHasColor lightHasWarmWhite lightHasWhite lightHs lightHsv lightMiredsRange lightOnReport lightRed lightRgb lightState lightTemperature lightTransitionStep lightTransitionTime lightUpdate lightUseRGB lightWarmWhite
    rf | rfbridge.cpp.o module_rf.cpp.o | |
