<!DOCTYPE html>
<html lang="">
    <head>
        <title>ESPurna 0.0.0</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" href="favicon.svg?inline">

        <link rel="stylesheet" href="vendor/pure-3.0.0.min.css">
        <link rel="stylesheet" href="vendor/pure-grids-responsive-3.0.0.min.css">
        <link rel="stylesheet" href="vendor/side-menu-layout.css">

        <link rel="stylesheet" href="src/index.css">
        <link rel="stylesheet" href="src/debug.css" class="module-cmd module-dbg">

        <script src="src/index.mjs" type="module"></script>
    </head>

    <body>
        <div id="error-notification" class="pure-g content">
        </div>

        <div id="layout" class="webmode">
            <div class="menu-link">
                <span></span>
            </div>

            <div id="menu">
                <div class="pure-menu">
                    <inline-source src="src/menu-list.html"></inline-source>

                    <div class="main-buttons">
                        <button type="button" class="pure-button button-save">Save</button>
                        <button type="button" class="pure-button button-reconnect">Reconnect</button>
                        <button type="button" class="pure-button button-reboot">Reboot</button>
                    </div>

                    <inline-source src="src/footer.html"></inline-source>
                </div>
            </div>

            <div class="content">
                <div class="panel block" id="panel-status">
                    <div class="header">
                        <h1><span data-key="hostname">?</span></h1>
                        <h2><span data-key="app_name">?</span> <span data-key="app_version">?</span></h2>
                        <h2><span data-key="desc">?</span></h2>
                    </div>

                    <div class="page">
                        <form class="pure-form pure-form-aligned">
                            <div data-parts="status" hidden></div>
                            <inline-source src="src/status.html"></inline-source>
                        </form>
                    </div>
                </div>

                <inline-source src="src/panel-password.html"></inline-source>

                <inline-source src="src/panel-admin.html"></inline-source>
                <inline-source src="src/panel-general.html"></inline-source>
                <inline-source src="src/panel-wifi.html"></inline-source>
                <inline-source
                    src="src/panel-debug.html"
                    class="module-cmd module-dbg"></inline-source>
                <inline-source
                    src="src/panel-mod.html"
                    class="module-mod"></inline-source>

                <!-- the panels of the modules (html/parts.mjs, src/parts.mjs) -->
                <div data-parts="panels" hidden></div>

            </div>
        </div>

        <inline-source src="src/template-base.html"></inline-source>
        <inline-source src="src/template-wifi.html"></inline-source>
        <div data-parts="templates" hidden></div>

        <a href="" target="_blank" rel="noopener" id="downloader">
            Download backup .json
        </a>
        <input id="uploader" type="file">
    </body>
</html>
