[platformio]
default_envs = esp8266
src_dir = espurna
; one ini and one build dir per chip: platformio_esp8266.ini / _esp32.ini / _beken.ini -> .pio/build_esp8266 / _esp32 / _beken
build_dir = .pio/build_esp8266
data_dir = espurna/data
test_dir = test/device
extra_configs =
    libraries.ini
    platformio_override.ini

# ------------------------------------------------------------------------------
# THE ESP8266 BUILD on ESP8266_RTOS_SDK (owner 2026-11-17: NONOS removed, the three chips on FreeRTOS without Arduino).
# The SDK comes COMPILED by its own release (framework-esp8266-rtos-sdk: igorufox/ESP8266_RTOS_SDK tools/espurna, its
# configuration there); scripts/esp8266_rtos_sdk.py links it and ESPurna's bootloader, the 1 MB layout is
# espurna/arch/esp8266/partitions.csv. No framework of the platform: the Arduino names of the code come
# from lib/espurna-core. arch/rtos is shared with ESP32 and Beken
#   py -3 -m platformio run -c platformio_esp8266.ini -e esp8266
# ------------------------------------------------------------------------------

[env:esp8266]
platform = ${platforms.esp8266}
platform_packages =
    ${platforms.esp8266_sdk}
    ${platforms.esp8266_libs}
; one esptool for both chips, 5.4.0 (owner 11-09, [platforms] esptool of libraries.ini): without this line every
; ESP8266 build put the platform's registry 1.30000 under the same package name and the ESP32 build lost its esptool
; (19.11 13:56 and 16:07)
    ${platforms.esptool}
; the compiler ([platforms] esp8266_toolchain) is no platform package here: the ESP32's package of the same name,
; taken from <core>/tools by scripts/esp8266_rtos_sdk.py (as a platform package its bare registry zip replaced the
; ESP32's installed one, 19.11)
board = esp01_1m
board_build.flash_mode = dout
; the CPU clock of the SDK (CONFIG_ESP8266_DEFAULT_CPU_FREQ_160, its default: WPA3 SAE is crypto), F_CPU of the code
board_build.f_cpu = 160000000L
; the chip's files: arch/esp8266, arch/rtos and the software I2C master of arch/soft (SPI is the HSPI port here, not
; the software master); the module_*.cpp objects are the modules'
build_src_filter = +<*> -<arch/esp32/> -<arch/beken/> -<arch/esp8266/bootloader/> -<arch/rtos/bootloader/> -<arch/soft/spi_soft.cpp> -<module_*.cpp>
build_flags = -std=${toolchain.cxx_std} -g -w -DARDUINO=10812 -Iespurna/arch/esp8266 -Iespurna/arch/rtos
    -DESP8266_GENERIC -DESPURNA_IMAGE=\"esp8266\" -DMODULES_SUPPORT=1 -DESPURNA_LWIP=\"${libraries.lwip}\" -DESPURNA_MBEDTLS=\"${libraries.mbedtls}\"
; ESP8266 and ARDUINO_ARCH_ESP8266 of the board stay, on every file as ESP32 has its macro: the libraries pick their
; chip code by them, and a module and its library must read a library header alike (FauxmoESP's members under ESP8266).
build_unflags = -DARDUINO_ESP8266_ESP01
extra_scripts =
    pre:scripts/esp8266_rtos_sdk.py
    pre:scripts/no_ino.py
    pre:scripts/head_page.py
    post:scripts/pio_main.py
    scripts/module_head.py
    scripts/esp8266_module_link.py
custom_head_exports = espurna/modules_exports.txt
; the module objects (scripts/module_link.py): MODULE_BUILD (espurna/config/head.h)
; VL53L1X_NO_ARDUINO: the VL53L1X library (igorufox/vl53l1x) on the bus the vl53l1x module gives it
custom_module_flags = -DMODULE_BUILD=1 -DVL53L1X_NO_ARDUINO
; libraries only the modules use (the head's LDF does not have them). espurna-core: the layer of the Arduino names
; (Wire, SPI, String ... of lib/espurna-core) for the third-party libraries of the modules only, the head links nothing
; of it (owner 2026-11-18: ESPurna's own code without the layer); last: the archives before it call into it
custom_module_libs = FauxmoESP DNSServer rc-switch VL53L1X BSEC_Software_Library IRremoteESP8266 RFM69 RPNlib Adafruit_NeoPixel QRCode espurna-core
; the part of a library the modules build (scripts/module_link.py): of RFM69 the radio (RFM69_OTA.cpp would need the SPIFlash library, ESPurna has no RFM69 OTA)
custom_module_lib_filter =
    RFM69 -<*> +<RFM69.cpp> +<RFM69_ATC.cpp>
; the modules: one list for every chip in espurna/config/head.h (ESPURNA_MODULES); here only the ESP8266's part
; (same columns as platformio_esp32.ini). fs_math.c (the small math of libs/fs_math.h instead of libm's): the sensors
; manager and the drivers that call it. The I2C master (the one software master of arch/soft/, as on Beken), the SDK's SPI and PWM drivers (arch/esp8266/*_esp8266.cpp) are in the
; modules that use them, not in the head: I2C in i2c, SPI in spi (on every chip; Wire and SPI of arduino_emu reach them
; through chip::i2c_bus / spi_bus), PWM in light_pwm
custom_modules =
    ntp | arch/rtos/ntp_rtos.cpp.o | |
    i2c | arch/soft/i2c_soft.cpp.o | |
    spi | arch/esp8266/spi_esp8266.cpp.o | |
    light_pwm | arch/esp8266/pwm_esp8266.cpp.o | |
    sensors | | fs_math.c.o
    cse7766 | | fs_math.c.o
    hlw8012 | | fs_math.c.o
    v9261f | | fs_math.c.o
    ntc | | fs_math.c.o
    mics2710 | | fs_math.c.o
    mics5525 | | fs_math.c.o
    emon_adc121 | | fs_math.c.o
    emon_ads1x15 | | fs_math.c.o
    emon_analog | | fs_math.c.o
; Matter is not an ESP8266 module: no Matter library for the chip; ble*: no Bluetooth radio on the ESP8266. The NSPanel
; is an ordinary module on every chip (it needs uart), Apply decides whether it fits
custom_modules_skip = matter matter_ble ble ble_sensors ble_wifi ble_proxy
monitor_speed = 115200
upload_speed = 115200
; no framework of the platform: the frameworks list of lib/espurna-core (the Arduino names) matches none,
; the LDF takes the libraries by their includes alone
lib_compat_mode = off
; the same libraries as ESP32 and Beken, every version once in libraries.ini
lib_deps =
    ; the head's: ESPurna's string (espurna_string.h) and the platform header of the forks
    ${libraries.espurna_base}
    ; the modules' libraries (custom_module_libs)
    ${libraries.fauxmoesp}
    ${libraries.rcswitch}
    ${libraries.vl53l1x}
    ${libraries.bsec}
    ${libraries.irremoteesp8266}
    ${libraries.rfm69}
    ${libraries.rpnlib}
    ${libraries.neopixel}
    ; the screen module's: the Matter pairing QR code (the same library on every chip)
    ${libraries.qrcode}
; the libraries only the modules use are out of the head's LDF (compiled for the modules by scripts/module_link.py);
; DNSServer: lib/DNSServer, the same code on every chip; Unity: the host tests' (test/)
lib_ignore =
    ; the layer of the Arduino names: the head links nothing of it, the modules' libraries get it (custom_module_libs)
    espurna-core
    FauxmoESP
    rc-switch
    DNSServer-espurna
    VL53L1X
    BSEC Software Library
    IRremoteESP8266
    RFM69
    RPNlib
    Adafruit NeoPixel
    QRCode
    Unity
