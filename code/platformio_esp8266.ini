[platformio]
default_envs = esp8266
src_dir = espurna
; one ini and one build dir per chip: platformio_esp8266.ini / _esp32.ini / _beken.ini -> .pio/build_esp8266 / _esp32 / _beken
build_dir = .pio/build_esp8266
data_dir = espurna/data
test_dir = test/device
extra_configs =
    platformio_ota.ini
    platformio_override.ini

# ------------------------------------------------------------------------------
# Add to or modify ANY section (env:..., common, etc.) via platformio_override.ini
#
# For example, to set f_cpu value for every environment:
# $ cat platformio_override.ini
# [env]
# board_build.f_cpu = 160000000
#
# ------------------------------------------------------------------------------

[common]
# ------------------------------------------------------------------------------
# PLATFORM:
#   !! DO NOT confuse platformio's ESP8266 development platform with Arduino core for ESP8266
#
#   arduino core 2.3.0 = espressif8266@1.5.0 (not supported)
#   arduino core 2.4.0 = espressif8266@1.6.0 (not supported)
#   arduino core 2.4.1 = espressif8266@1.7.3 (not supported)
#   arduino core 2.4.2 = espressif8266@1.8.0 (not supported)
#   arduino core 2.5.0 = espressif8266@2.0.4 (not supported)
#   arduino core 2.5.1 = espressif8266@2.1.1 (not supported)
#   arduino core 2.5.2 = espressif8266@2.2.3 (not supported)
#   arduino core 2.6.1 = espressif8266@2.3.0 (not supported)
#   arduino core 2.6.2 = espressif8266@2.3.1 (not supported)
#   arduino core 2.6.3 = espressif8266@2.4.0 (not supported)
#   arduino core 2.7.1 = espressif8266@2.5.3
#   arduino core 2.7.2 = espressif8266@2.6.0
#   arduino core 2.7.3 = espressif8266@2.6.1
#   arduino core 2.7.4 = espressif8266@2.6.3 (not supported)
#   arduino core 3.1.2 = espressif8266@4.2.0 (platform)
#
# ------------------------------------------------------------------------------

platform = espressif8266 @ ~4.2.0

# ------------------------------------------------------------------------------
# FLASH SIZE:
#   board and ldscript must specify real flash size of the device.
# NOTES:
#   fs space is not used right now.
#   SPIFFS_SUPPORT=1, FS_SUPPORT=1 will have no effect.
#   to avoid issues with OTA process, ensure that board & ldscript match (or less than) real flash size of the device.
# ------------------------------------------------------------------------------

# 999 KB sketch,  4 KB eeprom, 16 KB reserved
board_1m = esp01_1m
ldscript_1m = eagle.flash.1m.ld

# one layout for every chip size (the head of env:esp8266): settings at the same place on every board

# ------------------------------------------------------------------------------
# GLOBAL BUILD FLAGS:
#
# Available lwIP variants (macros):
#    -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH = v2 Higher Bandwidth (default)
#    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY       = v2 Lower Memory (TCP MSS set to 536, MSS * 2 send buffer)
#    -DPIO_FRAMEWORK_ARDUINO_LWIP_HIGHER_BANDWIDTH  = v1.4 Higher Bandwidth (deprecated, **not recommended**)
#
# BearSSL:
#   When building with -DSECURE_CLIENT=SECURE_CLIENT_BEARSSL, you can add the build flag -DBEARSSL_SSL_BASIC in order to build BearSSL with a limited set of ciphers:
#     TLS_RSA_WITH_AES_128_CBC_SHA256 / AES128-SHA256
#     TLS_RSA_WITH_AES_256_CBC_SHA256 / AES256-SHA256
#     TLS_RSA_WITH_AES_128_CBC_SHA / AES128-SHA
#     TLS_RSA_WITH_AES_256_CBC_SHA / AES256-SHA
#  This reduces total .bin size by about ~45KB, so it's especially useful on low memory boards (512k/1m).
#
#  It is **recommended** to add `board_build.f_cpu = 160000000` to the environment configuration
#  (either in `[env]` to set globally or `[env:...]` to use with the specific environment).
#
# ------------------------------------------------------------------------------
# lwIP 'Lower Memory' (MSS 536: 2 KB receive window, 1 KB send buffer per connection) instead of 'Higher Bandwidth'
# (MSS 1460: 5.8 KB / 2.9 KB): with the generic images' heap of 10-15 KB the larger buffers ran it out of memory while
# the WebUI loaded (truncated index) and during a browser upload to /upgrade (connection dropped half-way)
build_flags = -g -w -DNO_GLOBAL_EEPROM -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
# arduino core 3.1.2 with NONOS SDK 3.0.5 (its "experimental" option) instead of 2.2.2-dev(38a443e) of core 2.7.4:
# the home fleet crashed inside the 2.2.x Wi-Fi stack (sta_input, wpa_validate_wpa_ie)
build_flags_sdk3 = ${common.build_flags} -DPIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK305

# ------------------------------------------------------------------------------
# DEBUG BUILD FLAGS
#   build flags for the Core, must be set as global build_flag
#   (build_src_flags would not work)
#
# platformio_override.ini:
# [env:esp8266]
# build_flags = ${common.build_flags_sdk3} -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48 -DNON32XFER_HANDLER ${common.debug_flags}
#
# ------------------------------------------------------------------------------
debug_flags =
    -DDEBUG_ESP_CORE
    -DDEBUG_ESP_WIFI
    -DDEBUG_ESP_HTTP_CLIENT
    -DDEBUG_ESP_HTTP_SERVER
    -DDEBUG_ESP_HTTP_UPDATE
    -DDEBUG_ESP_UPDATER
    -DDEBUG_ESP_OTA
    -DDEBUG_ESP_SSL
    -DDEBUG_ESP_UPDATER
    -DDEBUG_TLS_MEM
    -DDEBUG_ESP_MDNS

# For memleaks etc, add:
#   -DDEBUG_ESP_OOM
#   -DUMM_POISON_CHECK
#   -DDEBUG_ESP_TLS_MEM

# For HWDTs postmortem support:
#   -DDEBUG_ESP_HWDT

# ------------------------------------------------------------------------------
# LIBRARIES: required dependencies
#   Please note that we don't always use the latest version of a library.
#   See https://registry.platformio.org/libraries for more info

#   We don't use `lib_deps` directly, since PlatformIO 6.0.0 our libraries
#   will always be installed into the environment-specific directory.
#   To install them in a single location, there's a manual update & install.
#
#   See https://github.com/platformio/platformio-core/issues/4206
# ------------------------------------------------------------------------------

shared_lib_dir = libraries/
shared_lib_deps =
    esp32async/ESPAsyncTCP@2.0.0
    bblanchon/ArduinoJson@^5.13.4
    marvinroger/AsyncMqttClient@^0.8.1
    xoseperez/EEPROM_Rotate@^0.9.2
    esp32async/ESPAsyncWebServer@3.12.1
    https://github.com/igorufox/fauxmoESP.git#3.4.1-espurna.1
    xoseperez/hlw8012@^1.1
    crankyoldgit/IRremoteESP8266@2.8.2
    xoseperez/my92xx@^3.0.3
    https://github.com/256dpi/arduino-mqtt#196556b6
    https://github.com/mcspr/nofuss.git#0.4.0
    paulstoffregen/OneWire@^2.3.5
    knolleary/PubSubClient@^2.8.0
    https://github.com/1technophile/rc-switch#11402652
    lowpowerlab/SPIFlash@^101.1.3
    lowpowerlab/RFM69@^1.5.1
    mcspr/RPNlib@^0.24.1
    teckel12/NewPing@^1.9.1
    sparkfun/SparkFun VEML6075 Arduino Library@^1.1.4
    pololu/VL53L1X@^1.0.1
    https://github.com/mcleng/MAX6675-Library#2.0.1
    https://github.com/ThingPulse/esp8266-oled-ssd1306#9be7b01
    adafruit/Adafruit BusIO@^1.11.5
    adafruit/Adafruit SI1145 Library@^1.2.0
    https://github.com/BoschSensortec/BSEC-Arduino-library.git#v1.6.1480
    adafruit/Adafruit NeoPixel@^1.7.0

git_platform_package =
    platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git

git_toolchain_package =
    platformio/toolchain-xtensa@^2.100300.220621

git_platform_packages =
    ${common.git_platform_package}
    ${common.git_toolchain_package}

# ------------------------------------------------------------------------------
# COMMON ENVIRONMENT SETTINGS:
# ------------------------------------------------------------------------------
[env]
build_src_filter = +<*> -<arch/esp32/>
platform = ${common.platform}
platform_packages =
    ${common.git_toolchain_package}
framework = arduino
board_build.flash_mode = dout
build_flags = ${common.build_flags}
monitor_speed = 115200
upload_speed = 115200
extra_scripts = pre:scripts/pio_pre.py, scripts/pio_main.py

lib_extra_dirs =
    libraries/

; DNSServer: the core's one (WiFiUDP) is replaced by lib/DNSServer, the same code on every chip (on its EspurnaUdp);
; DNSServer-espurna (lib/DNSServer) only in the captive module (custom_module_libs), out of the head's LDF
lib_ignore =
    AsyncTCP
    Brzo I2C
    DNSServer
    DNSServer-espurna

# ------------------------------------------------------------------------------
# THE ESP8266 BUILD: one env, one head image for every ESP8266 (docs/modules.md)
#   py -3 -m platformio run -c platformio_esp8266.ini -e esp8266
#
# The env's own image is the head: relays, buttons, LEDs, Wi-Fi + AP, web server + the WebUI, API, telnet, NTP, OTA
# and the module loader; pins come from the settings (device template search in the WebUI, boards of
# code/espurna/config/hardware.h are entries of igorufox/espurna-devices, scripts/boards_to_devices.py). Everything
# else is a module of custom_modules, compiled in the same build with custom_module_flags and linked against the head
# (scripts/esp8266_module_link.py, shared part scripts/module_link.py). Outputs in .pio/build_esp8266/esp8266:
#   espurna-esp8266.bin (.gz)    the head ("initial"): OTA of every ESP8266, serial flash at 0x0
#   espurna-esp8266-modules.bin  every module package (the MODULES panel / the head's page install from it)
#   espurna-esp8266-full.bin     serial flash from 0x0: the head, every module placed, the modules file at 1 MB
# Flash layout: the 1 MB layout (eagle.flash.1m.ld) on every chip size, settings in sectors 251 / 250 everywhere; on
# bigger chips the head keeps the modules file behind 1 MB. Boards installed with the old 4 MB layout (esp8266-4m
# image, settings at the end of 4 MB) move their settings once (backup / restore), ref. docs/modules.md
# ------------------------------------------------------------------------------

[env:esp8266]
board = ${common.board_1m}
board_build.ldscript = ${common.ldscript_1m}
; 48 KB IRAM (flash cache 16 KB): the IRAM after the code holds the RAM of the modules installed with ram=iram
build_flags = ${common.build_flags_sdk3} -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48 -DNON32XFER_HANDLER
; the head: espurna/config/head.h (one list for every chip), here only what is the ESP8266's
build_src_flags = -DESP8266_GENERIC -DMODULES_SUPPORT=1 -DESPURNA_IMAGE=\"esp8266\"
extra_scripts =
    pre:scripts/pio_pre.py
    scripts/pio_main.py
    scripts/module_head.py
    scripts/esp8266_module_link.py
custom_head_exports = espurna/modules_exports.txt
; ArduinoOTA references mDNS although ESPurna starts it without (begin(false)): the head takes stubs instead
; (modules_api_esp8266.cpp), the real mDNS (~21 KB) is the mdns module's; the heap protection (heap_reserve_esp8266.cpp):
; the SDK's allocations and operator new get a reserve when the heap is out, new TCP connections wait while it is low
custom_head_wraps =
    _ZN7esp826618MDNSImplementation13MDNSResponder13enableArduinoEtb
    _ZN7esp826618MDNSImplementation13MDNSResponder3endEv
    _ZN7esp826618MDNSImplementation13MDNSResponder5beginEPKcRK9IPAddressj
    _ZN7esp826618MDNSImplementation13MDNSResponder6updateEv
    pvPortZalloc
    sdk3_pvPortMalloc
    pvPortRealloc
    _Znwj
    _Znaj
; the module objects (scripts/module_link.py): MODULE_BUILD (espurna/config/head.h), plus the ESP8266's drivers
custom_module_flags = -DMODULE_BUILD=1
; the full image (scripts/esp8266_full_image.py): these modules' RAM goes to the IRAM tail, the rest to the DRAM arena
; (all of them together need ~8 KB, the arena has 5 KB); modules with interrupt code (light PWM, RF) stay in DRAM
custom_full_ram_in_iram = sensors
; libraries only the modules use (the head's lib_ignore keeps them out of its LDF): lib/DNSServer of the captive module
custom_module_libs = DNSServer
; the modules: one list for every chip in espurna/config/head.h (ESPURNA_MODULES); here only the ESP8266's part
;   custom_modules: a line of a module of that list adds the chip's own objects (first), a new name is a module of
;   this chip alone (same columns: <name> | <objects> | <objects only for what the head does not have> | <provides>
;   | <needs>); custom_modules_skip: the modules of the list this chip does not build
custom_modules =
    sensors | | fs_math.c.o
    light | | arch/esp8266/pwm_esp8266.c.o
custom_modules_skip = matter nspanel
