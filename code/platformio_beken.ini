; Beken BK72xx (Tuya CB2S / CB3S / WB2S ...) through LibreTiny
; ONE env, env:beken, one head image for every BK7231N board (docs/modules.md, "Beken"):
;   py -3 -m platformio run -c platformio_beken.ini -e beken
; one ini and one build dir per chip: platformio_esp8266.ini / _esp32.ini / _beken.ini -> .pio/build_esp8266 / _esp32 / _beken
;
; The env's own image is the head (Tuya flash layout): relays, buttons, LEDs (every GPIO of the chip, pins from a
; device template or the settings), Wi-Fi, web + the WebUI, API, telnet, NTP and the module loader (espurna/config/
; head.h, the same head on every chip). Everything else is a module (custom_modules: scheduler, alexa, mdns, mqtt,
; homeassistant, domoticz, thingspeak, matter, rf: the 433 MHz receiver on rc-switch, captive), compiled in the same
; build with custom_module_flags and linked against the head (scripts/beken_module_link.py, shared part scripts/module_link.py), installed from the WebUI MODULES
; panel into the OTA partition. The head keeps the MQTT forwarders (modules_api.cpp, MQTT_MODULE): its relays,
; buttons ... call the MQTT API as always, the mqtt module takes over when it starts. Outputs in .pio/build_beken/beken:
;   espurna-beken-tuya.uf2          the head: first flash over UART1 with ltchiptool (Tuya bootloader), and OTA
;   espurna-beken-modules.bin  every module package (the MODULES panel installs from it)
; Matter as a module: IPv6 in lwIP (CONFIG_IPV6 of the BDK) and the lwIP options of the prebuilt Matter library
; (github.com/igorufox/matter-bk7231n, scripts/beken_matter_lib.py) in the head, the library itself only in the
; matter module; the Matter stack answers mDNS itself (the mdns module is ESPurna's own responder, not next to Matter).

[platformio]
src_dir = espurna
build_dir = .pio/build_beken
default_envs = beken
; the versions of the platform and the libraries: one for every chip (no [platformio] there, the build dir stays)
extra_configs = libraries.ini

[env:beken]
platform = ${platforms.beken}
framework = arduino
board = generic-bk7231n-qfn32-tuya
build_unflags = -std=gnu++11
; mutex_beken.h: std::mutex for every C++ unit (libraries too)
; LT_UART_DEFAULT_PORT=1: LibreTiny & SDK log (crash dumps too) on UART1, the flashing pads, instead of UART2 (P0)
; Each option is set once here: PlatformIO puts -U after every -D, `-UX -DX=1` leaves X undefined
; --wrap=bk_trap_*: our crash handlers keep the stability counter; --wrap=vApplicationMallocFailedHook: a failed
;   allocation leaves a crash record instead of a silent hang until the watchdog (ref. rtcmem_beken.cpp)
; --wrap=lt_wdt_*: the stall watcher sees the feeding and writes the task contexts before the watchdog fires
; the head: espurna/config/head.h (one list for every chip), here only what is the Beken's
; module RAM: the data TCM the head leaves free, then one heap block, sized at each Apply (modules_beken.cpp)
build_flags = -std=gnu++17 -includemutex_beken.h -DLT_UART_DEFAULT_PORT=1 -Iespurna/arch/beken -Iespurna/arch/rtos -Wl,--wrap=bk_trap_udef -Wl,--wrap=bk_trap_pabt -Wl,--wrap=bk_trap_dabt -Wl,--wrap=bk_trap_resv -Wl,--wrap=vApplicationMallocFailedHook -Wl,--wrap=lt_wdt_enable -Wl,--wrap=lt_wdt_disable -Wl,--wrap=lt_wdt_feed -DBEKEN_GENERIC -DESPURNA_IMAGE=\"beken\" -DCONFIG_IPV6 -DMODULES_SUPPORT=1 -DESPURNA_LWIP=\"${libraries.lwip}\"
lib_ldf_mode = deep+
lib_compat_mode = off
; TCP, TLS, the web server, telnet, MQTT: ESPurna's own on lwIP (libs/tcp.h, tls.h, http_server.h, mqtt_client.h)
; FauxmoESP: our fork with the LibreTiny code paths, the same version on all three chips;
; lib/DNSServer (DNSServer-espurna): the captive portal DNS of every chip, on its EspurnaUdp; only in the captive module
;   (custom_module_libs), out of the head's LDF
lib_deps =
    ${libraries.arduinojson}
    ${libraries.rcswitch}
    ${libraries.fauxmoesp}
    ; BearSSL of the one TLS (libs/tls.h): the sources of the ESP8266 core's, as a library
    ${libraries.bearssl}
    ${libraries.onewire}
    ${libraries.my92xx}
    ${libraries.hlw8012}
    ${libraries.newping}
    ${libraries.veml6075}
    ${libraries.vl53l1x}
    ${libraries.max6675}
    ${libraries.adafruit_busio}
    ${libraries.si1145}
    ${libraries.bsec}
    ${libraries.irremoteesp8266}
    ${libraries.rfm69}
    ${libraries.rpnlib}
    ${libraries.neopixel}
    ${libraries.ssd1306}
; the libraries of the modules (custom_module_libs, the same on every chip, scripts/ci_ini_lint.py): out of the head's LDF
; lib_beken/Wire, lib_beken/SPI: LibreTiny has none for the Beken chips, the software ones of the i2c and the
; spi module (custom_module_libs)
lib_extra_dirs = lib_beken
lib_ignore =
    Wire
    SPI
    FauxmoESP
    rc-switch
    OneWire
    my92xx
    hlw8012
    DNSServer-espurna
    NewPing
    SparkFun VEML6075 Arduino Library
    VL53L1X
    MAX6675-Library
    Adafruit BusIO
    Adafruit SI1145 Library
    BSEC Software Library
    IRremoteESP8266
    RFM69
    RPNlib
    Adafruit NeoPixel
    ESP8266 and ESP32 OLED driver for SSD1306 displays
; the chip's files: arch/beken and arch/rtos; the module_*.cpp objects are the modules'
build_src_filter = +<*> -<arch/esp8266/> -<arch/esp32/> -<module_*.cpp> -<espurna.ino.cpp>
; No BLE (BK7231N SDK links the whole BLE 5.1 stack otherwise), OTA image has to fit the 664 KiB 'download' partition
; No PMF / WPA3: with them the supplicant fails the handshake (AUTH_FAIL) with OpenWrt psk2 + 802.11r + ieee80211w=1 APs
custom_options.sys_config.h =
    CFG_SUPPORT_BLE = 0
    CFG_IEEE80211W = 0
    CFG_WPA3 = 0
; .bss of ESPurna in the data TCM, which only the Wi-Fi driver uses with BLE off (ref. scripts/beken_tcm.py); the 4 KiB
; settings buffer stays in the main RAM, room in the TCM for the modules
custom_tcm_bss = yes
custom_tcm_main_ram = arch/beken/storage_eeprom_beken.cpp.o
; the prebuilt Matter library (scripts/beken_matter_lib.py): its lwipopts.h for the head's lwIP (with IPv6), the library
; itself only for the matter module. Pinned (owner 2026-11-10): a new release of the library is taken here by hand
custom_matter_lib = https://github.com/igorufox/matter-bk7231n/releases/download/libmatter-20261107-06fec34/matter-bk7231n-lib.zip
custom_matter_lib_sha256 = 5a321983ed4bac1717e863d69f2c616392f1a6cddb6f7deeee3bbbaee7423971
extra_scripts =
    pre:scripts/no_ino.py
    pre:scripts/beken_matter_lib.py
    post:scripts/beken_tcm.py
    post:scripts/pio_main.py
    post:scripts/module_head.py
    post:scripts/beken_module_link.py
custom_head_exports = espurna/modules_exports.txt
; the module objects (scripts/module_link.py): MODULE_BUILD (espurna/config/head.h), plus what only the Beken has:
; Matter, the 433 MHz receiver on rc-switch
; SENSOR_SUPPORT: the magnitude parts of Domoticz, Thingspeak, Home Assistant (the head forwards to the sensors
;   module, none here yet: no magnitudes)
; os_delay_us: the ESP8266 SDK name my92xx (light module) calls, LibreTiny has delayMicroseconds
custom_module_flags = -DMODULE_BUILD=1 -Dos_delay_us=delayMicroseconds
custom_module_libs = FauxmoESP DNSServer rc-switch Wire OneWire my92xx hlw8012 NewPing SparkFun_VEML6075_Arduino_Library VL53L1X MAX6675-Library Adafruit_BusIO Adafruit_SI1145_Library IRremoteESP8266 RFM69 RPNlib Adafruit_NeoPixel ESP8266_and_ESP32_OLED_driver_for_SSD1306_displays SPI
; the part of a library the modules build (scripts/module_link.py): of Adafruit BusIO the I2C device of si1145
custom_module_lib_filter =
    Adafruit_BusIO -<*> +<Adafruit_I2CDevice.cpp>
; the modules: one list for every chip in espurna/config/head.h (ESPURNA_MODULES); here only the Beken's part
;   custom_modules: a line of a module of that list adds the chip's own objects (first), a new name is a module of
;   this chip alone (same columns: <name> | <objects> | <objects only for what the head does not have> | <provides>
;   | <needs>); custom_modules_skip: the modules of the list this chip does not build
custom_modules =
    ntp | arch/beken/ntp_beken.cpp.o arch/rtos/ntp_rtos.cpp.o | |
    matter | arch/beken/matter_beken.cpp.o | |
; bme680: the Bosch BSEC library of the driver is prebuilt (libalgobsec.a), Bosch ships it for ESP8266, ESP32 and
; Cortex-M, not for the ARM968E-S of the BK7231N: nothing to link it with
custom_modules_skip = bme680
