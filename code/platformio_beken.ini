; Beken BK72xx (Tuya CB2S / CB3S / WB2S ...) on the BDK alone (no LibreTiny, owner 2026-11-18): ESPurna's platform
; igorufox/platform-beken (libraries.ini beken), the BDK built by scripts/beken_bdk.py, the chip code in espurna/arch/beken (core_beken.cpp)
; ONE env, env:beken, one head image for every BK7231N board (docs/modules.md, "Beken"):
;   py -3 -m platformio run -c platformio_beken.ini -e beken
; one ini and one build dir per chip: platformio_esp8266.ini / _esp32.ini / _beken.ini -> .pio/build_esp8266 / _esp32 / _beken
;
; The env's own image is the head (Tuya flash layout): relays, buttons, LEDs (every GPIO of the chip, pins from a
; device template or the settings), Wi-Fi, web + the WebUI, API, telnet, NTP and the module loader (espurna/config/
; head.h, the same head on every chip). Everything else is a module (custom_modules: scheduler, alexa, mdns, mqtt,
; homeassistant, domoticz, thingspeak, matter, rf: the 433 MHz receiver on rc-switch, captive), compiled in the same
; build with custom_module_flags and linked against the head (scripts/beken_module_link.py, shared part scripts/module_link.py), installed from the WebUI MODULES
; panel into the OTA partition. The head keeps the MQTT forwarders (modules_api.cpp, MQTT_MODULE): its relays,
; buttons ... call the MQTT API as always, the mqtt module takes over when it starts. Outputs in .pio/build_beken/beken:
;   espurna-beken-tuya.uf2          the head: first flash over UART1 (Tuya bootloader), and OTA
;   espurna-beken-modules.bin  every module package (the MODULES panel installs from it)
; Matter as a module: IPv6 in lwIP (CONFIG_IPV6 of the BDK) and the lwIP options of the prebuilt Matter library
; (github.com/igorufox/matter-espurna, scripts/matter_lib.py) in the head, the library itself only in the
; matter module; mDNS is the mdns module (one responder of ESPurna, libs/mdns_responder.h) - with Matter as well once the Matter library publishes through it.

[platformio]
src_dir = espurna
build_dir = .pio/build_beken
default_envs = beken
; the versions of the platform and the libraries: one for every chip (no [platformio] there, the build dir stays)
extra_configs = libraries.ini

[env:beken]
platform = ${platforms.beken}
; GCC 14.2 as the ESP32 (U25, libraries.ini beken_toolchain)
platform_packages =
    ${platforms.beken_toolchain}
    ${platforms.beken_bdk}
    ${platforms.beken_flashdb}
; the Tuya flash layout of the BK7231N (boards/ of igorufox/platform-beken)
board = bk7231n-tuya
; mutex_beken.h: std::mutex for every C++ unit (libraries too)
; ARDUINO: the Arduino API version the third-party libraries of the modules test (lib/espurna-core, as ESP8266, ESP32)
; BK72XX: the chip family, as ESP8266 / ESP32 on the other chips
; the SDK log (crash dumps too) on UART1, the flashing pads (core_beken.cpp espurna_beken_main())
; Each option is set once here: PlatformIO puts -U after every -D, `-UX -DX=1` leaves X undefined
; --wrap=bk_trap_*: our crash handlers keep the stability counter; --wrap=vApplicationMallocFailedHook: a failed
;   allocation leaves a crash record instead of a silent hang until the watchdog (ref. rtcmem_beken.cpp)
; --wrap=sys_mutex_new: the lwIP core lock without priority inheritance (arch/beken/compat_beken.cpp)
; --wrap=sta_ip_is_start: the station counts as up with its netif linked and addressed (arch/beken/wifi_driver_beken.cpp)
; the head: espurna/config/head.h (one list for every chip), here only what is the Beken's
; module RAM: the data TCM the head leaves free, then one heap block, sized at each Apply (modules_beken.cpp)
build_flags = -std=${toolchain.cxx_std} -Os -includemutex_beken.h -DARDUINO=10812 -DBK72XX=1 -Iespurna/arch/beken -Iespurna/arch/rtos -Wl,--wrap=bk_trap_udef -Wl,--wrap=bk_trap_pabt -Wl,--wrap=bk_trap_dabt -Wl,--wrap=bk_trap_resv -Wl,--wrap=vApplicationMallocFailedHook -Wl,--wrap=sys_mutex_new -Wl,--wrap=sta_ip_is_start -DBEKEN_GENERIC -DESPURNA_IMAGE=\"beken\" -DMODULES_SUPPORT=1 -DESPURNA_LWIP=\"${libraries.lwip}\" -DESPURNA_MBEDTLS=\"${libraries.mbedtls}\"
lib_ldf_mode = deep+
lib_compat_mode = off
; TCP, TLS, the web server, telnet, MQTT: ESPurna's own on lwIP (libs/tcp.h, tls.h, http_server.h, mqtt_client.h)
; FauxmoESP: our fork, the same version on all three chips;
; lib/DNSServer (DNSServer-espurna): the captive portal DNS of every chip; only in the captive module
;   (custom_module_libs), out of the head's LDF
lib_deps =
    ; the head's: ESPurna's string (espurna_string.h) and the platform header of the forks
    ${libraries.espurna_base}
    ${libraries.rcswitch}
    ${libraries.fauxmoesp}
    ${libraries.vl53l1x}
    ${libraries.bsec}
    ${libraries.irremoteesp8266}
    ${libraries.rfm69}
    ${libraries.rpnlib}
    ${libraries.neopixel}
    ; the nspanelqr module's (custom_module_libs)
    ${libraries.qrcode}
; the libraries of the modules (custom_module_libs, the same on every chip, scripts/ci_ini_lint.py): out of the head's LDF
; espurna-core (lib/espurna-core): the layer of the Arduino names, only for the third-party libraries of the modules
;   (the arduino module, last in custom_module_libs), never the head's
lib_ignore =
    espurna-core
    FauxmoESP
    rc-switch
    DNSServer-espurna
    VL53L1X
    BSEC Software Library
    IRremoteESP8266
    RFM69
    RPNlib
    Adafruit NeoPixel
    QRCode
; the chip's files: arch/beken and arch/rtos (arch/beken/bdk: the glue of the BDK, scripts/beken_bdk.py builds it with the
; BDK's flags); the module_*.cpp objects are the modules'
build_src_filter = +<*> -<arch/esp8266/> -<arch/esp32/> -<arch/beken/bdk/> -<arch/rtos/bootloader/> -<module_*.cpp> -<espurna.ino.cpp>
; espurna/arch/beken/bdk/config/sys_config.h: no BLE (BK7231N SDK links the whole BLE 5.1 stack otherwise), OTA image
; has to fit the 664 KiB 'download' partition; no PMF / WPA3: with them the supplicant fails the handshake (AUTH_FAIL)
; with OpenWrt psk2 + 802.11r + ieee80211w=1 APs
; .bss of ESPurna in the data TCM, which only the Wi-Fi driver uses with BLE off (ref. scripts/beken_tcm.py); the 4 KiB
; settings buffer is on the heap (storage_eeprom.cpp), room in the TCM for the modules
custom_tcm_bss = yes
; the prebuilt Matter library of matter-espurna, its BK7231N package (scripts/matter_lib.py): its lwipopts.h for the
; head's lwIP (with IPv6), the library itself only for the matter module. Pinned (owner 2026-11-10): a new release of
; the library is taken here by hand
custom_matter_chip = bk7231n
; mDNS of Matter: ESPurna's one responder (libs/mdns_responder.h, chip_mdns "platform" of the library)
custom_matter_lib = https://github.com/igorufox/matter-espurna/releases/download/libmatter-20261120-6062eea/matter-espurna-bk7231n.zip
custom_matter_lib_sha256 = ad2ac2345dbb47a326f4276c6a37bab653b2cc06f4bc0c380006a49ceae48d24
extra_scripts =
    pre:scripts/no_ino.py
    pre:scripts/head_page.py
    pre:scripts/beken_gcc14.py
    pre:scripts/matter_lib.py
    pre:scripts/beken_bdk.py
    post:scripts/beken_image.py
    post:scripts/beken_tcm.py
    post:scripts/pio_main.py
    post:scripts/module_head.py
    post:scripts/beken_module_link.py
custom_head_exports = espurna/modules_exports.txt
; the module objects (scripts/module_link.py): MODULE_BUILD (espurna/config/head.h), plus what only the Beken has:
; Matter, the 433 MHz receiver on rc-switch
; SENSOR_SUPPORT: the magnitude parts of Domoticz, Thingspeak, Home Assistant (the head forwards to the sensors
;   module, none here yet: no magnitudes)
; VL53L1X_NO_ARDUINO: the VL53L1X library (igorufox/vl53l1x) on the bus the vl53l1x module gives it
custom_module_flags = -DMODULE_BUILD=1 -DVL53L1X_NO_ARDUINO
custom_module_libs = FauxmoESP DNSServer rc-switch VL53L1X IRremoteESP8266 RFM69 RPNlib Adafruit_NeoPixel QRCode espurna-core
; the part of a library the modules build (scripts/module_link.py): of RFM69 the radio (RFM69_OTA.cpp would need the SPIFlash library, ESPurna has no RFM69 OTA)
custom_module_lib_filter =
    RFM69 -<*> +<RFM69.cpp> +<RFM69_ATC.cpp>
; the modules: one list for every chip in espurna/config/head.h (ESPURNA_MODULES); here only the Beken's part
;   custom_modules: a line of a module of that list adds the chip's own objects (first), a new name is a module of
;   this chip alone (same columns: <name> | <objects> | <objects only for what the head does not have> | <provides>
;   | <needs>); custom_modules_skip: the modules of the list this chip does not build
; ble: the driver, the BLE 5.x stack from the archives (libble_stack.a of scripts/beken_bdk.py, libble_bk7231n.a)
custom_modules =
    ntp | arch/rtos/ntp_rtos.cpp.o | |
    i2c | arch/soft/i2c_soft.cpp.o | |
    spi | arch/soft/spi_soft.cpp.o | |
    light_pwm | arch/beken/pwm_beken.cpp.o | |
    matter | arch/beken/matter_beken.cpp.o | |
    ble | arch/beken/ble_beken.cpp.o | |
; bme680: the Bosch BSEC library of the driver is prebuilt (libalgobsec.a), Bosch ships it for ESP8266, ESP32 and
; Cortex-M, not for the ARM968E-S of the BK7231N: nothing to link it with
custom_modules_skip = bme680
