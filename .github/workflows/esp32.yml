name: ESP32 Build

on:
  push:
    branches: [esp32-port]
    tags: ['esp32-*']
  pull_request:
    branches: [esp32-port]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esp32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32-generic, esp32-relay-x2, esp32-nspanel, itead-sonoff-minir4]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-platformio
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('code/platformio_esp32.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-${{ matrix.env }}-
    - name: Install PlatformIO
      run: |
        pip install -U platformio
    - name: Build
      working-directory: code
      env:
        # LDF deep+ evaluates preprocessor expressions with python eval, and '\e' (ESC)
        # in some framework header spams SyntaxWarning on python >= 3.12
        PYTHONWARNINGS: ignore::SyntaxWarning
      run: |
        # pio libs sometimes use raw hash instead of version, avoid useless warnings
        git config --global advice.detachedHead false
        pio run -c platformio_esp32.ini -e ${{ matrix.env }}
    - name: Collect binaries
      run: |
        build=code/.pio/build/${{ matrix.env }}
        mkdir -p dist
        # merged image (bootloader + partitions + boot_app0 + app), flash at 0x0
        cp ${build}/espurna-${{ matrix.env }}.bin dist/espurna-${{ matrix.env }}-full.bin
        # app only, for OTA
        cp ${build}/firmware.bin dist/espurna-${{ matrix.env }}-ota.bin
        cp ${build}/firmware.elf dist/espurna-${{ matrix.env }}.elf
        ls -l dist
    - uses: actions/upload-artifact@v4
      with:
        name: espurna-${{ matrix.env }}-${{ github.sha }}
        path: dist/

  # every push to esp32-port (or esp32-* tag, or manual run) becomes a single release
  # with the images of all boards, same as upstream snapshot builds
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: espurna-*-${{ github.sha }}
        merge-multiple: true
        path: dist/
    - name: Release variables
      id: release
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/esp32-* ]]; then
          tag="${GITHUB_REF_NAME}"
        else
          tag="esp32-$(date +'%y%m%d')-${GITHUB_SHA::7}"
        fi
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        ls -l dist
    - uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: ESP32 build (${{ steps.release.outputs.tag }})
        body: |
          Automatic build of ${{ github.ref_name }} @ ${{ github.sha }}

          - `espurna-esp32-generic-*` - any ESP32 with 4 MB flash, no GPIOs pre-assigned, configure from the WebUI or import a Tasmota template
          - `espurna-esp32-relay-x2-*` - LC-Tech ESP32 2-relay board
          - `espurna-esp32-nspanel-*` - Sonoff NSPanel EU (gen1) with the Lovelace UI TFT, screen built from `/nspanel.json`, see `nspanel/README.md`
          - `espurna-itead-sonoff-minir4-*` - Sonoff MINIR4 "Mini Extreme" (ESP32): relay GPIO26, button GPIO0, S1/S2 GPIO27, LED GPIO19
          - `*-full.bin` - merged image (bootloader + partitions + app), flash at 0x0
          - `*-ota.bin` - application only, for OTA upgrade from the WebUI
        make_latest: true
        files: |
          dist/*-full.bin
          dist/*-ota.bin
    # keep only the newest automatic builds (esp32-YYMMDD-sha); releases of hand-made esp32-* tags stay
    - name: Prune old automatic releases
      env:
        GH_TOKEN: ${{ github.token }}
        KEEP: 5
      run: |
        gh release list --repo "${GITHUB_REPOSITORY}" --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
          | grep -E '^esp32-[0-9]{6}-[0-9a-f]{7}$' \
          | tail -n +$((KEEP + 1)) \
          | while read -r tag; do
              echo "deleting ${tag}"
              gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
            done
