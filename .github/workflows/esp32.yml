name: Firmware Build

on:
  push:
    branches: [rtos]
    tags: ['rtos-*']
  pull_request:
    branches: [rtos]
  # One line, the rtos branch (owner 2026-11-24: the unify branch is not needed): releases tagged rtos-*, the lists on
  # Pages (firmware.json, firmware-preview.json) of those only - the esp32-* releases of the old line are never offered.
  # Release channels: every build above becomes a PRE-release ("preview", not tested on hardware). A stable release
  # is only made by hand: Actions -> Firmware Build -> Run workflow, `promote` = the tag of a preview, `bench` = what was
  # tested on hardware. The stable release gets the files of that preview (tag rtos-stable-<the preview's tag>) and
  # becomes Latest. Without `promote` a manual run is a normal build (preview)
  workflow_dispatch:
    inputs:
      promote:
        description: 'Promote: tag of the preview release to make stable (e.g. rtos-261124-4846d7f). Empty = a normal build'
        required: false
        default: ''
        type: string
      bench:
        description: 'Promote: what was tested on hardware (boards, functions, how long). Required with promote, goes into the release notes'
        required: false
        default: ''
        type: string

# read-only for every job; the two jobs that publish a release ask for write themselves (B6)
permissions:
  contents: read

concurrency:
  # a promote neither cancels the build of the branch nor is cancelled by it
  group: esp32-${{ github.ref }}-${{ inputs.promote && 'promote' || 'build' }}
  cancel-in-progress: ${{ !inputs.promote }}

jobs:
  # first: the PlatformIO configs (scripts/ci_ini_lint.py): -U in build flags, a macro with two values in one env,
  # build dirs other than the three of the chips, one ESPURNA_IMAGE form, library versions and lib_ignore of the
  # module libraries equal on every chip, pinned platforms
  ini-lint:
    if: ${{ !inputs.promote }}
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-platformio
    - name: Install PlatformIO
      # only its ProjectConfig: the lint resolves the ini files the way the build does (without it: configparser)
      run: |
        pip install 'platformio==6.2.0'
    - name: Lint the PlatformIO configs
      working-directory: code
      run: |
        python scripts/ci_ini_lint.py platformio_esp8266.ini platformio_esp32.ini platformio_beken.ini

  # unit tests of code/test/unit: the host compiler, ESPurna's own code without Arduino (host/ in place of the chip) and Unity
  host-tests:
    needs: ini-lint
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - name: Cache CMake
      uses: actions/cache@v6
      with:
        path: code/test/unit/cache
        key: ${{ runner.os }}-cmake-${{ hashFiles('code/test/unit/CMakeLists.txt') }}
    - name: Host tests
      working-directory: code/test/unit
      run: |
        command -v cmake > /dev/null || sudo apt-get install -y -qq cmake
        cmake -B build
        cmake --build build
        cmake --build build --target test

  # WebUI: the vitest specs (html/spec/*.spec.mjs), eslint, html-validate, then the build of the one WebUI
  webui-tests:
    needs: ini-lint
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'
    - name: Cache Node
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('code/package-lock.json', 'code/package.json') }}
    - name: Install
      working-directory: code
      run: |
        npm ci
    - name: WebUI tests
      working-directory: code
      run: |
        node_modules/.bin/vitest run
    - name: Lint
      working-directory: code
      run: |
        node node_modules/gulp/bin/gulp.js eslint
        node node_modules/gulp/bin/gulp.js html-validate
    - name: Build
      working-directory: code
      run: |
        node node_modules/gulp/bin/gulp.js build
        # note of varying zlib output, especially when using pigz
        git --no-pager diff --stat

  # a red lint or test: no build, no release
  build:
    needs: [ini-lint, host-tests, webui-tests]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # one env per chip (docs/modules.md): the head image (ESPURNA_IMAGE = the env name), every module and the
        # release files in one `pio run -e <chip>`; the board is picked in the WebUI (device template search / Tasmota
        # import), the features are modules (WebUI MODULES panel). `name` is the release file name, espurna-<name>*
        include:
        - { arch: esp8266, config: platformio_esp8266.ini, env: esp8266, name: esp8266 }
        - { arch: esp32, config: platformio_esp32.ini, env: esp32, name: esp32 }
        - { arch: beken, config: platformio_beken.ini, env: beken, name: beken }
    steps:
    - uses: actions/checkout@v7
    # the WebUI before the firmware: the webui module of every chip is html/build/index.html.gz (in .gitignore) and
    # scripts/module_link.py leaves the module out silently when the file is not there (W10); the parts of the modules
    # (espurna/static/ui_<name>.ipp) are written by the same build
    - uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'
    - name: Cache Node
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('code/package-lock.json', 'code/package.json') }}
    - name: WebUI
      working-directory: code
      run: |
        npm ci
        node node_modules/gulp/bin/gulp.js build
        test -s html/build/index.html.gz
    - uses: actions/setup-python@v7
      with:
        # not '3.x': 3.15 broke the build (pioarduino takes 3.10..3.14, LibreTiny could not make its venv)
        python-version: '3.13'
    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-platformio
    - name: Cache PlatformIO
      uses: actions/cache@v6
      with:
        path: ~/.platformio
        # py313: the caches of the 3.15 runs hold a broken LibreTiny venv
        key: ${{ runner.os }}-pio-py313-${{ matrix.env }}-${{ hashFiles(format('code/{0}', matrix.config)) }}
        restore-keys: |
          ${{ runner.os }}-pio-py313-${{ matrix.env }}-
    - name: Install PlatformIO
      run: |
        # ESP32: pioarduino needs PlatformIO Core >= 6.2
        # cryptography: the AES of the Beken OTA package (scripts/beken_image.py package_ota)
        pip install 'platformio==6.2.0' 'cryptography==46.0.3'
    - name: esptool of the ESP8266 build
      if: matrix.arch == 'esp8266'
      run: |
        # [platforms] esptool of libraries.ini: the esptool of esptool_version that pioarduino puts into <core>/tools (one esptool for
        # both chips, owner 2026-11-09); on its own runner the ESP8266 job makes that folder itself
        dir=~/.platformio/tools/tool-esptoolpy
        version=$(python -c "import configparser; c = configparser.ConfigParser(interpolation=None); c.read('code/libraries.ini'); print(c['platforms']['esptool_version'])")
        if [ ! -f "$dir/package.json" ]; then
          python -m pip install --no-deps --target "$dir" "esptool==${version}"
          echo "{\"name\": \"tool-esptoolpy\", \"version\": \"${version}\"}" > "$dir/package.json"
        fi
    - name: Build
      working-directory: code
      env:
        # LDF deep+ evaluates preprocessor expressions with python eval, and '\e' (ESC)
        # in some framework header spams SyntaxWarning on python >= 3.12
        PYTHONWARNINGS: ignore::SyntaxWarning
        # Beken only: scripts/beken_matter_lib.py reads the Matter library release from the GitHub API,
        # authenticated (the job token is read-only, see `permissions`); the other chips get no token
        GITHUB_TOKEN: ${{ matrix.arch == 'beken' && github.token || '' }}
      run: |
        # pio libs sometimes use raw hash instead of version, avoid useless warnings
        git config --global advice.detachedHead false
        pio run -c ${{ matrix.config }} -e ${{ matrix.env }}
    # the host tests that need what this build made: the bootloader step's swap and rollback with power cuts on the
    # head just built (code/test/unit/src/rbl_swap), the SDK's Legendre symbol against mbedTLS (sae_legendre), the
    # lx106 code of the compiler: call0 ABI, no entry / retw (gcc14_esp8266/probe.c)
    - name: ESP8266 host checks
      if: matrix.arch == 'esp8266'
      run: |
        sh code/test/unit/src/rbl_swap/run.sh "${PWD}/code/.pio/build_esp8266/${{ matrix.env }}/firmware.bin" 7 | tail -3
        (cd code/test/unit/src/sae_legendre && sh run.sh ~/.platformio/packages/framework-esp8266-rtos-sdk)
        tools=~/.platformio/tools/toolchain-xtensa-esp-elf
        "${tools}/bin/xtensa-esp-elf-gcc" -mdynconfig="${tools}/lib/xtensa_esp8266.so" -O2 -c \
          code/test/unit/src/gcc14_esp8266/probe.c -o probe.o
        "${tools}/bin/xtensa-esp-elf-objdump" -d probe.o > probe.txt
        if grep -E '\s(entry|retw)(\.n)?(\s|$)' probe.txt; then
          echo "::error::the lx106 code has windowed calls (entry / retw)"
          exit 1
        fi
    - name: Collect binaries
      run: |
        env=${{ matrix.env }}
        name=espurna-${{ matrix.name }}
        mkdir -p dist
        case "${{ matrix.arch }}" in
        esp32)
          build=code/.pio/build_esp32/${env}
          # the merged image (bootloader, partitions, boot_app0, the head): serial flash at 0x0
          cp ${build}/${name}.bin dist/${name}.bin
          # the install image: the head and every module package (the Apply of the MODULES panel)
          cp ${build}/${name}.ota dist/
          ;;
        beken)
          build=code/.pio/build_beken/${env}
          # the two initial images of the head, one per bootloader (Tuya, Quectel): first flash over UART1, and OTA from
          # the WebUI
          cp ${build}/${name}-tuya.uf2 ${build}/${name}-quectel.uf2 dist/
          # the install image: both heads and every module package (the Apply of the MODULES panel)
          cp ${build}/${name}.ota dist/
          ;;
        esp8266)
          build=code/.pio/build_esp8266/${env}
          # the head ("initial"): serial flash at 0x0, and OTA from the WebUI. The compressed copy for OTA is made for
          # GitHub Pages (pages job), not a release file
          cp ${build}/${name}.bin dist/${name}.bin
          # the install image: the head and every module package (the Apply of the MODULES panel, the head's page)
          cp ${build}/${name}.ota dist/
          ;;
        esac
        cp ${build}/firmware.elf dist/${name}.elf
        ls -l dist
    - uses: actions/upload-artifact@v7
      with:
        name: espurna-${{ matrix.env }}-${{ github.sha }}
        path: dist/
    # static RAM / flash (and the ESP8266 heap region) against scripts/ci_budget.json, after the upload so the ELF of
    # a failed check stays downloadable. Over budget: the job fails, no release
    - name: Size budget
      run: |
        python code/scripts/ci_budget.py --arch ${{ matrix.arch }} --name ${{ matrix.name }} dist/espurna-${{ matrix.name }}.elf

  # every push to rtos (or rtos-* tag, or manual run without `promote`) becomes a single PRE-release
  # ("preview") with the images of all boards; boards offer it only from the preview list (pages job)
  release:
    needs: [ini-lint, host-tests, webui-tests, build]
    if: ${{ github.event_name != 'pull_request' && !inputs.promote }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: espurna-*-${{ github.sha }}
        merge-multiple: true
        path: dist/
    - name: Release variables
      id: release
      run: |
        # the one line: rtos (its tags rtos-*)
        line=rtos
        if [[ "${GITHUB_REF}" == refs/tags/rtos-* ]]; then
          tag="${GITHUB_REF_NAME}"
        else
          tag="${line}-$(date +'%y%m%d')-${GITHUB_SHA::7}"
        fi
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        echo "line=${line}" >> "$GITHUB_OUTPUT"
        ls -l dist
    - uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.release.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: Preview build (${{ steps.release.outputs.tag }})
        body: |
          Preview: automatic build of ${{ github.ref_name }} @ ${{ github.sha }}, not tested on hardware. Boards list it only from the preview release list (WebUI, ADMIN, *Release list*: `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/firmware-preview.json`); the default list has the stable releases only. A preview tested on hardware becomes stable by a manual run of the *Firmware Build* workflow with `promote` = this tag.

          One head image per chip, the board is picked after flashing: WebUI, ADMIN, *Device Template* (Tasmota templates, OpenBeken devices and the boards of this firmware) or *Tasmota Profile Import*. The features are modules: tick them in the WebUI, *MODULES*, and *Apply* (the board writes the ticked ones anew from the `.ota` of the same release, see `docs/modules.md`).

          ESP8266 on ESP8266_RTOS_SDK 3.4 (FreeRTOS 11), the 1 MB flash layout on every chip size:
          - `espurna-esp8266.bin` - the head: serial flash at 0x0 or OTA (the WebUI takes the compressed copy from the release list by itself)
          - `espurna-esp8266.ota` - the install image: the head and every module (sensors, scheduler, alexa, mdns, mqtt, homeassistant, domoticz, thingspeak, light, rf, captive, the WebUI); not for a serial flash tool
          Boards installed with the 4 MB layout (`espurna-esp8266-4m`) keep their settings elsewhere: back them up and restore them after the update.

          ESP32 on ESP-IDF 5.5, one application partition (ESPurna at 0x10000, 3712 KB with the modules):
          - `espurna-esp32.bin` - the head, any ESP32 with 4 MB flash (the NSPanel too: the `screen` and `nextion` modules; the M5Stack: `screen` and `lcd`): serial flash at 0x0, the head over the network from the `.ota`
          - `espurna-esp32.ota` - the install image: the head and every module (sensors, scheduler, alexa, mdns, mqtt, homeassistant, domoticz, thingspeak, light, rf, matter, screen, oled, lcd, nextion, captive); not for a serial flash tool

          Beken BK7231N (see `beken/README.md`): one head, an initial image per bootloader
          - `espurna-beken-tuya.uf2` - the head, Tuya bootloader (CB2S, CB3S, CBU ...): first flash over UART1, and OTA from the WebUI
          - `espurna-beken-quectel.uf2` - the same head, Quectel bootloader (XH-CB2S / BK7231M, 4 MB): first flash over UART1, and OTA from the WebUI
          - `espurna-beken.ota` - the install image: both heads (the board takes the one of its bootloader) and every module (sensors, scheduler, alexa, mdns, mqtt, homeassistant, domoticz, thingspeak, light, rf, matter, captive); not for a serial flash tool
        prerelease: true
        make_latest: false
        files: |
          dist/*.bin
          dist/*.bin.gz
          dist/*.uf2
          dist/*.ota
    # keep only the newest automatic previews of this line (pre-releases tagged <line>-YYMMDD-sha). Never deleted:
    # stable releases (not pre-release; promoted ones are tagged <line>-stable-*), releases of hand-made tags, the
    # previews of the other line
    - name: Prune old previews
      env:
        GH_TOKEN: ${{ github.token }}
        KEEP: 5
        LINE: ${{ steps.release.outputs.line }}
      run: |
        gh release list --repo "${GITHUB_REPOSITORY}" --limit 200 --json tagName,createdAt,isPrerelease \
            --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[].tagName' \
          | grep -E "^${LINE}-[0-9]{6}-[0-9a-f]{7}\$" \
          | tail -n +$((KEEP + 1)) \
          | while read -r tag; do
              echo "deleting ${tag}"
              gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
            done

  # manual run with `promote`: the files of a preview go into a new full release rtos-stable-<preview tag> at the same
  # commit, marked Latest, with the `bench` text in its notes. The preview itself stays (and is pruned later as usual)
  promote:
    if: ${{ inputs.promote }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
    - name: Make the preview a stable release
      env:
        GH_TOKEN: ${{ github.token }}
        PREVIEW: ${{ inputs.promote }}
        BENCH: ${{ inputs.bench }}
      run: |
        set -euo pipefail
        repo="${GITHUB_REPOSITORY}"
        line="${PREVIEW%%-*}"
        if [[ ! "${PREVIEW}" =~ ^rtos-[0-9A-Za-z._-]+$ ]] || [[ "${PREVIEW}" == "${line}"-stable-* ]]; then
          echo "::error::promote: '${PREVIEW}' is not the tag of a preview release (rtos-YYMMDD-sha)"
          exit 1
        fi
        if [ -z "${BENCH//[[:space:]]/}" ]; then
          echo "::error::bench: required with promote - what was tested on hardware (boards, functions, how long)"
          exit 1
        fi
        prerelease=$(gh release view "${PREVIEW}" --repo "${repo}" --json isPrerelease --jq .isPrerelease) || {
          echo "::error::no release ${PREVIEW}"
          exit 1
        }
        if [ "${prerelease}" != true ]; then
          echo "::error::${PREVIEW} is not a preview (pre-release)"
          exit 1
        fi
        stable="${line}-stable-${PREVIEW#"${line}"-}"
        if gh release view "${stable}" --repo "${repo}" > /dev/null 2>&1; then
          echo "::error::${stable} exists already"
          exit 1
        fi
        commit=$(gh api "repos/${repo}/commits/${PREVIEW}" --jq .sha)
        mkdir -p dist
        gh release download "${PREVIEW}" --repo "${repo}" --dir dist
        ls -l dist
        {
          echo "Stable release: the files of the preview ${PREVIEW} (commit ${commit}), tested on hardware."
          echo
          echo "## Tested on hardware"
          echo
          printf '%s\n' "${BENCH}"
          echo
          echo "## Notes of the preview"
          echo
          gh release view "${PREVIEW}" --repo "${repo}" --json body --jq .body
        } > notes.md
        gh release create "${stable}" dist/* --repo "${repo}" --target "${commit}" \
          --title "Firmware ${stable}" --notes-file notes.md --latest
        echo "${PREVIEW} -> ${stable}" >> "${GITHUB_STEP_SUMMARY}"

  # GitHub Pages copy of the kept releases + firmware.json, for the WebUI (ADMIN, OTA, *Install from GitHub*):
  # release files themselves come from release-assets.githubusercontent.com without CORS (the browser cannot
  # download them) and need ECDHE (the Beken mbedTLS has none); Pages serves them with Access-Control-Allow-Origin: *.
  # Two lists: firmware.json - the stable releases only (the default list of the WebUI: what boards offer by default), firmware-preview.json - stable and preview releases
  # (set as *Release list*, webFwUrl, to get previews). Every release entry has "channel": "stable" / "preview".
  # Settings -> Pages -> Source: GitHub Actions. Nothing is committed to the repository
  pages:
    needs: [release, promote]
    if: ${{ always() && github.event_name != 'pull_request' && (needs.release.result == 'success' || needs.promote.result == 'success') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    # only the scripts (code/scripts/esp32_partitions.py)
    - uses: actions/checkout@v7
      with:
        sparse-checkout: code/scripts
    - name: Download the kept releases
      env:
        GH_TOKEN: ${{ github.token }}
        # newest previews (pre-releases) and newest stable releases (full releases, promoted or older ones)
        KEEP: 5
        KEEP_STABLE: 3
      run: |
        # the releases of the line (rtos-*), into site/
        for line in rtos; do
          folder=site
          mkdir -p "${folder}"
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 200 --exclude-drafts --json tagName,createdAt,isPrerelease \
              --jq 'sort_by(.createdAt) | reverse | .[] | select(.tagName | startswith("'"${line}"'-"))
                    | "\(.tagName) \(if .isPrerelease then "preview" else "stable" end)"' > "${folder}/all.txt"
          cat "${folder}/all.txt"
          # lines "<tag> <channel>"
          {
            grep ' stable$' "${folder}/all.txt" | head -n "${KEEP_STABLE}" || true
            grep ' preview$' "${folder}/all.txt" | head -n "${KEEP}" || true
          } > "${folder}/tags.txt"
          rm "${folder}/all.txt"
          while read -r tag channel; do
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir "${folder}/${tag}"
            gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json tagName,publishedAt,targetCommitish,url \
              > "${folder}/${tag}/release.json"
          done < "${folder}/tags.txt"
        done
    # A release has one file per image; the board-side copies the WebUI needs are made here, for Pages only:
    # - ESP8266 .bin.gz: OTA; none of the modules file and the full image (no OTA files)
    - name: Pages copies (.bin.gz)
      run: |
        sudo apt-get install -y -qq pigz > /dev/null
        for bin in site/*/espurna-esp8266*.bin; do
          [ -e "${bin}" ] || continue
          [ -e "${bin}.gz" ] && continue
          case "${bin}" in
          *-modules.bin|*-full.bin) ;;
          *) gzip -9 -n -c "${bin}" > "${bin}.gz" ;;
          esac
        done
        ls -lR site
    - name: Write firmware.json
      run: |
        python3 - <<'PY'
        import datetime, hashlib, html, json, os, re

        # espurna-<image>.bin / .bin.gz / .uf2 / -initial-<loader>.uf2 (and -ota.bin / -full.bin of the
        # older releases), <image> = the dist name of the build matrix and the ESPURNA_IMAGE of the firmware (WebUI
        # picks the files of the running image)
        SUFFIXES = (
            (".ota", "install"),          # the install image: head(s) + every module package (WebUI: MODULES, Apply)
            ("-modules.bin", "modules"),  # every module package of the head (WebUI MODULES panel, the head's page)
            ("-ota.bin", "ota"),          # ESP32 application of the older releases
            ("-full.bin", "serial"),      # ESP8266: kind "full", head + modules from 0x0 (the MODULES panel takes the
                                          # modules file at 1 MB out of it); ESP32 merged image of the older releases
            (".bin.gz", "ota"),           # ESP8266 compressed OTA (Pages only since one file per image)
            (".bin", "ota"),              # ESP32 merged image (serial at 0x0), ESP8266 (also serial
                                          # at 0x0), Beken OTA image
            (".uf2", "ota"),              # Beken: espurna-beken-tuya.uf2 (Tuya bootloader), espurna-beken-quectel.uf2
                                          # (image beken-quectel: the WebUI of a Quectel board asks for that one)
        )

        # (image, kind); image "<chip>-*" - every image of that chip in the release
        def classify(name):
            if not name.startswith("espurna-"):
                return []
            rest = name[len("espurna-"):]
            for suffix, kind in SUFFIXES:
                if rest.endswith(suffix):
                    image = rest[:-len(suffix)]
                    # first flash over UART only (Beken, per bootloader), any image of the chip
                    initial = re.fullmatch(r"(.+)-initial-[0-9a-z]+", image)
                    if initial:
                        return [(initial.group(1) + "-*", "serial")]
                    # one install image per chip: every image of the chip (beken-tuya and beken-quectel take beken.ota)
                    if kind == "install":
                        return [(image + "-*", "install")]
                    if suffix == "-full.bin" and image.startswith("esp8266"):
                        kind = "full"
                    return [(image, kind)]
            return []

        def sha256(path):
            digest = hashlib.sha256()
            with open(path, "rb") as f:
                for chunk in iter(lambda: f.read(1 << 16), b""):
                    digest.update(chunk)
            return digest.hexdigest()

        KIND_ORDER = {"ota": 0, "serial": 1, "modules": 4, "full": 5, "install": 6}

        # image of an older release -> the head of the same chip (one env per chip since 2026-11)
        LEGACY = {
            "esp8266-1m": "esp8266",
            "esp8266-1m-light": "esp8266",
            "esp8266-1m-sensor": "esp8266",
            "esp32-matter": "esp32",
            "esp32-matter-nspanel": "esp32",
            # the older Beken image with one OTA file for both bootloaders: a Tuya board takes the plain .uf2, a
            # Quectel one refuses it (the older firmware checks the download partition) and is updated by wire
            "beken-matter": "beken-tuya",
            # the head before the initial image of each bootloader had its own name (fwImage "beken")
            "beken": "beken-tuya",
        }

        # the releases of the line in site/ (the download step)
        def write_line(SITE):
            if not os.path.exists(os.path.join(SITE, "tags.txt")):
                return

            releases = []
            # "<tag> <channel>" lines, channel: stable (full release) / preview (pre-release)
            with open(os.path.join(SITE, "tags.txt")) as f:
                tags = [line.split() for line in f if line.strip()]

            for tag, channel in tags:
                folder = os.path.join(SITE, tag)
                with open(os.path.join(folder, "release.json")) as f:
                    info = json.load(f)
                os.remove(os.path.join(folder, "release.json"))

                images = {}
                shared = []
                for name in sorted(os.listdir(folder)):
                    path = os.path.join(folder, name)
                    for image, kind in classify(name):
                        entry = {
                            "name": name,
                            "kind": kind,
                            "size": os.path.getsize(path),
                            "sha256": sha256(path),
                            "url": f"{tag}/{name}",
                        }
                        if image.endswith("-*"):
                            shared.append((image[:-1], entry))
                        else:
                            images.setdefault(image, []).append(entry)

                for prefix, entry in shared:
                    for image, files in images.items():
                        if image.startswith(prefix) or (image + "-") == prefix:
                            files.append(dict(entry))

                # the images of the older releases a board may still run: their WebUI looks for its own image name, it
                # gets the files of the chip's head. Not esp8266-4m (its settings are not where the head keeps them, the
                # board moves them first)
                for old, new in LEGACY.items():
                    if old not in images and new in images:
                        images[old] = [dict(entry) for entry in images[new] if entry["kind"] == "ota"]

                for files in images.values():
                    files.sort(key=lambda x: (KIND_ORDER.get(x["kind"], 9), x["size"]))

                commit = info.get("targetCommitish", "")
                if not re.fullmatch(r"[0-9a-f]{40}", commit):
                    commit = tag.rsplit("-", 1)[-1]

                releases.append({
                    "tag": tag,
                    "channel": channel,
                    "date": info.get("publishedAt", ""),
                    "commit": commit,
                    "release": info.get("url", ""),
                    "images": dict(sorted(images.items())),
                })

            # newest first (the WebUI's "install the newest" takes the first one)
            releases.sort(key=lambda release: release["date"], reverse=True)
            generated = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

            def manifest(channels):
                return {
                    "version": 1,
                    "repository": os.environ["GITHUB_REPOSITORY"],
                    "generated": generated,
                    "channels": channels,
                    "releases": [release for release in releases if release["channel"] in channels],
                }

            # the default list of every board: stable only. Previews on demand: webFwUrl = firmware-preview.json
            stable = manifest(["stable"])
            preview = manifest(["stable", "preview"])
            with open(os.path.join(SITE, "firmware.json"), "w") as f:
                json.dump(stable, f, indent=1)
            with open(os.path.join(SITE, "firmware-preview.json"), "w") as f:
                json.dump(preview, f, indent=1)

            rows = []
            for release in releases:
                rows.append(f"<h2>{html.escape(release['tag'])} ({release['channel']})</h2><ul>")
                for image, files in release["images"].items():
                    links = ", ".join(
                        f"<a href=\"{html.escape(x['url'])}\">{html.escape(x['name'])}</a> ({x['kind']}, {x['size']} bytes)"
                        for x in files)
                    rows.append(f"<li><b>{html.escape(image)}</b>: {links}</li>")
                rows.append("</ul>")

            with open(os.path.join(SITE, "index.html"), "w") as f:
                f.write("<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>ESPurna firmware</title></head><body>"
                        "<h1>ESPurna firmware</h1><p>Copies of the newest releases for the WebUI, ADMIN, OTA, "
                        "<i>Install from GitHub</i>: <a href=\"firmware.json\">firmware.json</a> (stable, tested on "
                        "hardware), <a href=\"firmware-preview.json\">firmware-preview.json</a> (stable and preview "
                        "builds)</p>"
                        + "".join(rows) + "</body></html>\n")

            os.remove(os.path.join(SITE, "tags.txt"))
            print(json.dumps(preview, indent=1))

        for folder in ("site",):
            write_line(folder)
        PY
    # one artifact per attempt: a re-run of this job otherwise finds the github-pages artifact of the failed
    # attempt as well and deploy-pages stops ("Multiple artifacts named github-pages")
    - uses: actions/upload-pages-artifact@v5
      with:
        path: site/
        name: github-pages-${{ github.run_attempt }}
    - id: deploy
      uses: actions/deploy-pages@v5
      with:
        artifact_name: github-pages-${{ github.run_attempt }}
